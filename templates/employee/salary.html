    <script>
        if (typeof fmtMoney !== 'function') {
            window.fmtMoney = function(val) {
                var n = parseFloat(val);
                if (isNaN(n)) n = 0;
                return '¥' + n.toFixed(2);
            };
        }
        if (typeof safeNum !== 'function') {
            window.safeNum = function(val) {
                var n = parseFloat(val);
                return isNaN(n) ? 0 : n;
            };
        }
        function shadeThemeColor(hex, percent) {
            if (!hex) return '#06ad56';
            const f = parseInt(hex.slice(1), 16);
            const t = percent < 0 ? 0 : 255;
            const p = Math.abs(percent) / 100;
            const R = f >> 16, G = (f >> 8) & 0x00FF, B = f & 0x0000FF;
            return '#' + (
                0x1000000 +
                (Math.round((t - R) * p) + R) * 0x10000 +
                (Math.round((t - G) * p) + G) * 0x100 +
                (Math.round((t - B) * p) + B)
            ).toString(16).slice(1);
        }
        let currentUser = null;
        let latestYM = '';
        let myChart = null;
        const _state = { amountShow: false };
        function fitAmountFont(el) {
            if (!el) return;
            const len = el.textContent.trim().length;
            if (len <= 8) el.style.fontSize = '40px';
            else if (len <= 12) el.style.fontSize = '32px';
            else if (len <= 15) el.style.fontSize = '26px';
            else el.style.fontSize = '20px';
        }
        function fitStatFont(el) {
            if (!el) return;
            const len = el.textContent.trim().length;
            if (len <= 9) el.style.fontSize = '';
            else if (len <= 12) el.style.fontSize = '14px';
            else if (len <= 15) el.style.fontSize = '12px';
            else el.style.fontSize = '11px';
        }
        document.addEventListener('DOMContentLoaded', async function() {
            await loadUserInfo();
        });
        async function loadUserInfo() {
            try {
                const resp = await fetch('/api/auth/me');
                if (resp.status === 401) {
                    const redirect = encodeURIComponent(window.location.pathname + window.location.search);
                    window.location.href = '/api/auth/login?redirect=' + redirect;
                    return;
                }
                currentUser = await resp.json();
                if (!currentUser.logged_in) {
                    const redirect = encodeURIComponent(window.location.pathname + window.location.search);
                    window.location.href = '/api/auth/login?redirect=' + redirect;
                    return;
                }
                if (!currentUser.password_set) {
                    window.location.href = '/employee/password';
                } else {
                    loadDashboard();
                }
            } catch (e) {
                console.error('获取用户信息失败', e);
                weui.topTips('获取用户信息失败');
            }
        }
        async function loadDashboard() {
            try {
                const listResp = await fetch('/api/salary/list');
                if (listResp.status === 401) {
                    const redirect = encodeURIComponent('/employee/salary');
                    window.location.href = '/api/auth/login?redirect=' + redirect;
                    return;
                }
                if (!listResp.ok) {
                    weui.topTips('加载失败 (HTTP ' + listResp.status + ')');
                    return;
                }
                const listData = await listResp.json();
                if (!listData.success) {
                    weui.topTips(listData.error || '加载工资数据失败');
                    return;
                }
                // 未设置密码 -> 引导设置
                if (listData.need_password && listData.need_setup) {
                    window.location.href = '/employee/password';
                    return;
                }
                // 需要验证密码 -> 跳至工资条详情页（自带密码输入弹窗）
                if (listData.need_password) {
                    const list = listData.list || [];
                    const urlYm = new URLSearchParams(window.location.search).get('ym');
                    let ym = urlYm || '';
                    if (!ym && list.length > 0) {
                        ym = list[0].year_month;
                    }
                    if (ym) {
                        window.location.href = '/employee/detail?ym=' + ym;
                    } else {
                        window.location.href = '/employee/detail';
                    }
                    return;
                }
                const list = listData.list || [];
                const years = listData.years || [];
                // 带 ym 参数时，直接跳转到对应月份的详情页
                const urlYm = new URLSearchParams(window.location.search).get('ym');
                if (urlYm) {
                    window.location.href = '/employee/detail?ym=' + urlYm;
                    return;
                }
                document.getElementById('mainContent').style.display = 'block';
                if (!list.length) {
                    document.getElementById('latestAmount').textContent = '--';
                    document.getElementById('latestMonth').textContent = '暂无工资数据';
                    document.getElementById('latestStatus').textContent = '📭 暂无数据';
                    fillYearSelector([new Date().getFullYear()], new Date().getFullYear());
                    // 无工资数据时，chart 和 history 接口也会要密码，直接跳过
                    document.getElementById('mainContent').style.display = 'block';
                    return;
                }
                const latest = list[0];
                latestYM = latest.year_month;
                const defaultYear = String(latest.year_month).slice(0, 4);
                document.getElementById('userName').textContent = (currentUser.name || '同事').trim();
                // 最新卡片的 ￥ 由 HTML 里的小 ￥ span 承担，这里只写纯数字（避免 fmtMoney 再带一个 ￥）
                (function() {
                    var n = parseFloat(latest.real_pay);
                    if (isNaN(n)) n = 0;
                    var el = document.getElementById('latestAmount');
                    el.textContent = n.toFixed(2);
                    fitAmountFont(el);
                })();
                const ymText = latest.year_month.slice(0,4) + '年' + latest.year_month.slice(4,6) + '月薪资';
                document.getElementById('latestMonth').textContent = ymText;
                document.getElementById('latestStatus').textContent = latest.confirmed ? '✅ 已确认' : '⏳ 待确认';
                fillYearSelector(years, defaultYear);
                await loadChart();
            } catch (e) {
                console.error('loadDashboard error', e);
                weui.topTips('加载工资数据失败：' + (e.message || e));
            }
        }
        function fillYearSelector(years, selectedYear) {
            const sel = document.getElementById('yearSelector');
            sel.innerHTML = '';
            if (!years || !years.length) {
                const y = new Date().getFullYear();
                const opt = document.createElement('option');
                opt.value = y;
                opt.textContent = y + '年';
                sel.appendChild(opt);
            } else {
                years.forEach(y => {
                    const opt = document.createElement('option');
                    opt.value = y;
                    opt.textContent = y + '年';
                    if (String(y) === String(selectedYear)) opt.selected = true;
                    sel.appendChild(opt);
                });
            }
            sel.onchange = () => {
                loadChart();
            };
        }
        async function loadChart() {
            try {
                const yearEl = document.getElementById('yearSelector');
                if (!yearEl) return;
                const year = yearEl.value;
                if (!year) return;
                const resp = await fetch('/api/salary/chart/' + year);
                if (resp.status === 401) {
                    const redirect = encodeURIComponent('/employee/salary');
                    window.location.href = '/api/auth/login?redirect=' + redirect;
                    return;
                }
                const data = await resp.json();
                if (data.success === false && data.error) {
                    weui.topTips(data.error);
                    return;
                }
                // 未设置密码 -> 引导设置
                if (data.need_password && data.need_setup) {
                    window.location.href = '/employee/password';
                    return;
                }
                // 需要验证密码 -> 跳详情页
                if (data.need_password) {
                    // 使用全局缓存的最新年月，没有则直接跳详情页
                    const firstYM = latestYM;
                    if (firstYM) window.location.href = '/employee/detail?ym=' + firstYM;
                    else window.location.href = '/employee/detail';
                    return;
                }
                const salaryTotal = safeNum(data.total);
                const bonusVal = safeNum(data.bonus_total || 0);
                const combined = salaryTotal + bonusVal;
                const avgVal = safeNum(data.average);
                document.getElementById('statsSalary').textContent = '¥' + salaryTotal.toFixed(2);
                document.getElementById('statsBonus').textContent = '¥' + bonusVal.toFixed(2);
                document.getElementById('statsTotal').textContent = '¥' + combined.toFixed(2);
                document.getElementById('statsAvg').textContent = '¥' + avgVal.toFixed(2);
                fitStatFont(document.getElementById('statsSalary'));
                fitStatFont(document.getElementById('statsBonus'));
                fitStatFont(document.getElementById('statsTotal'));
                fitStatFont(document.getElementById('statsAvg'));
                // 奖金>0：2×2 网格（工资收入/月均工资 + 奖金/合计），label改为"工资收入"
                // 奖金=0：1×2 网格（总收入/月平均），label改为"总收入"
                const bonusItem = document.getElementById('statBonusItem');
                const totalItem = document.getElementById('statTotalItem');
                const salaryLabel = document.querySelector('#statsSalary').previousElementSibling;
                const avgLabel = document.querySelector('#statsAvg').previousElementSibling;
                if (bonusVal > 0) {
                    bonusItem.style.display = '';
                    totalItem.style.display = '';
                    salaryLabel.textContent = '工资收入（元）';
                    avgLabel.textContent = '月均工资（元）';
                } else {
                    bonusItem.style.display = 'none';
                    totalItem.style.display = 'none';
                    salaryLabel.textContent = '总收入（元）';
                    avgLabel.textContent = '月平均（元）';
                }
                if (myChart) myChart.dispose();
                myChart = echarts.init(document.getElementById('salaryChart'));
                const vw = window.innerWidth;
                const baseFont = Math.max(10, Math.min(12, vw / 36));
                const yFont = Math.max(9, Math.min(11, vw / 38));
                const bonusTotal = safeNum(data.bonus_total || 0);
                const hasBonus = bonusTotal > 0;
                // xAxis：12个月 +（有奖金则追加"年度奖金"）
                const xLabels = hasBonus ? data.months.concat(['奖金']) : data.months;
                // 工资 series：始终12个数据
                const salaryData = data.salaries.slice();
                // 奖金 series：前12个 null，第13个放奖金（没有奖金就不加此series）
                const bonusSeriesData = data.salaries.map(() => null).concat([bonusTotal]);
                const option = {
                    tooltip: {
                        trigger: 'axis',
                        backgroundColor: 'rgba(0,0,0,0.75)',
                        borderColor: 'transparent',
                        textStyle: { color: '#fff', fontSize: 12 },
                        formatter: params => {
                            let html = params[0].axisValue;
                            params.forEach(p => {
                                if (!p.value && p.value !== 0) return;
                                if (p.seriesName === '奖金') {
                                    const val = safeNum(p.value);
                                    html += '<br/>奖金合计：' + (val > 0 ? '¥' + val.toFixed(2) : '暂无奖金');
                                } else if (p.seriesName === '实发工资') {
                                    html += '<br/>实发工资：¥' + safeNum(p.value).toFixed(2);
                                }
                            });
                            return html;
                        }
                    },
                    grid: { left: '3%', right: '3%', bottom: '4%', top: '8%', containLabel: true },
                    xAxis: {
                        type: 'category',
                        data: xLabels,
                        axisLabel: { fontSize: baseFont, color: '#999', interval: 0 },
                        axisLine: { lineStyle: { color: '#eee' } },
                        axisTick: { show: false }
                    },
                    yAxis: {
                        type: 'value',
                        axisLabel: {
                            fontSize: yFont,
                            color: '#999',
                            formatter: v => v >= 10000 ? (v/10000).toFixed(1) + 'w' : v
                        },
                        splitLine: { lineStyle: { color: '#f5f5f5', type: 'dashed' } }
                    },
                    series: [{
                        name: '实发工资',
                        type: 'bar',
                        data: salaryData,
                        barWidth: vw < 340 ? '35%' : '45%',
                        itemStyle: {
                            color: new echarts.graphic.LinearGradient(0, 0, 0, 1, [
                                { offset: 0, color: getComputedStyle(document.documentElement).getPropertyValue('--theme').trim() || '#07c160' },
                                { offset: 1, color: shadeThemeColor(getComputedStyle(document.documentElement).getPropertyValue('--theme').trim() || '#07c160', -10) }
                            ]),
                            borderRadius: [4, 4, 0, 0]
                        },
                        label: { show: false }
                    }]
                };
                // 有奖金才追加"奖金"橙色柱
                if (hasBonus) {
                    option.series.push({
                        name: '奖金',
                        type: 'bar',
                        data: bonusSeriesData,
                        barWidth: vw < 340 ? '25%' : '30%',
                        itemStyle: {
                            color: new echarts.graphic.LinearGradient(0, 0, 0, 1, [
                                { offset: 0, color: '#ffb74d' },
                                { offset: 1, color: '#f57c00' }
                            ]),
                            borderRadius: [4, 4, 0, 0]
                        },
                        label: { show: false }
                    });
                }
                myChart.setOption(option);
                // 提取为命名函数，避免每次 loadChart 累积 resize 监听器
                if (window._salaryResizeHandler) {
                    window.removeEventListener('resize', window._salaryResizeHandler);
                }
                window._salaryResizeHandler = () => {
                    if (!myChart) return;
                    myChart.resize();
                    const vw2 = window.innerWidth;
                    const newBaseFont = Math.max(10, Math.min(12, vw2 / 36));
                    const newYFont = Math.max(9, Math.min(11, vw2 / 38));
                    myChart.setOption({
                        xAxis: { axisLabel: { fontSize: newBaseFont } },
                        yAxis: { axisLabel: { fontSize: newYFont } },
                        series: [{ barWidth: vw2 < 340 ? '35%' : '45%' }]
                    });
                };
                window.addEventListener('resize', window._salaryResizeHandler);
            } catch (e) {
                console.error('loadChart error', e);
            }
        }
        function openLatestDetail() {
            if (latestYM) {
                window.location.href = '/employee/detail?ym=' + latestYM;
            }
        }
        // ===== 金额显示/隐藏切换 =====
        function toggleAmount() {
            _state.amountShow = !_state.amountShow;
            const icon = document.getElementById('toggleAmount');
            icon.textContent = _state.amountShow ? '👁' : '🙈';
            // 最新卡片金额
            document.querySelectorAll('#latestAmount').forEach(el => {
                if (_state.amountShow) el.classList.remove('hidden-amount');
                else el.classList.add('hidden-amount');
            });
            // 图表卡片金额
            document.querySelectorAll('.chart-stat-value').forEach(el => {
                if (_state.amountShow) el.classList.remove('hidden-amount');
                else el.classList.add('hidden-amount');
            });
            // 历史记录
            document.querySelectorAll('#historyList .history-item .amount').forEach(el => {
                if (_state.amountShow) el.classList.remove('hidden-amount');
                else el.classList.add('hidden-amount');
            });
        }
    </script>
</body>
</html>
