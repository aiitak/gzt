    <script>
        document.getElementById('eyeBtn0').addEventListener('click', function() {
            const input = document.getElementById('oldPw');
            if (input.type === 'password') { input.type = 'text'; this.textContent = '🙈'; }
            else { input.type = 'password'; this.textContent = '👁'; }
        });
        document.getElementById('eyeBtn1').addEventListener('click', function() {
            const input = document.getElementById('newPw');
            if (input.type === 'password') { input.type = 'text'; this.textContent = '🙈'; }
            else { input.type = 'password'; this.textContent = '👁'; }
        });
        document.getElementById('eyeBtn2').addEventListener('click', function() {
            const input = document.getElementById('confirmPw');
            if (input.type === 'password') { input.type = 'text'; this.textContent = '🙈'; }
            else { input.type = 'password'; this.textContent = '👁'; }
        });

        async function savePassword() {
            const oldPw = document.getElementById('oldPw').value;
            const newPw = document.getElementById('newPw').value;
            const confirmPw = document.getElementById('confirmPw').value;
            const hasOldField = document.getElementById('oldField').style.display !== 'none';

            if (hasOldField && !oldPw) {
                weui.topTips('请输入原密码');
                return;
            }
            if (newPw.length < 4 || newPw.length > 20) {
                weui.topTips('密码长度需4-20位');
                return;
            }
            if (newPw !== confirmPw) {
                weui.topTips('两次密码不一致');
                return;
            }

            try {
                const body = hasOldField
                    ? {old_password: oldPw, password: newPw}
                    : {password: newPw};
                const resp = await fetch('/api/auth/password/set', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(body)
                });
                const data = await resp.json();
                if (data.success) {
                    weui.toast('✅ 密码设置成功', 1500);
                    document.getElementById('newPw').value = '';
                    document.getElementById('confirmPw').value = '';
                    setTimeout(function(){
                        location.href = '/employee/salary';
                    }, 1500);
                } else {
                    weui.topTips(data.error || '设置失败');
                }
            } catch (e) {
                weui.topTips('网络错误');
            }
        }

        async function resetPassword() {
            weui.confirm('确定要重置密码吗？重置后需要重新设置', async function() {
                try {
                    const resp = await fetch('/api/auth/password/reset', {method: 'POST'});
                    const data = await resp.json();
                    if (data.success) {
                        weui.toast('✅ 密码已重置', 1500);
                        setTimeout(function(){ location.reload(); }, 1500);
                    } else {
                        weui.topTips(data.error || '重置失败');
                    }
                } catch (e) {
                    weui.topTips('网络错误');
                }
            });
        }

        // 初始化：检查是否已设置密码
        (async function init() {
            try {
                const resp = await fetch('/api/auth/me');
                const data = await resp.json();
                const oldField = document.getElementById('oldField');
                const newLabel = document.getElementById('newPw').closest('.field').querySelector('.field-label');
                const confirmLabel = document.getElementById('confirmPw').closest('.field').querySelector('.field-label');
                
                if (data.password_set) {
                    oldField.style.display = 'block';
                    newLabel.textContent = '新密码';
                    confirmLabel.textContent = '确认新密码';
                    document.querySelector('.card .title').textContent = '修改工资条密码';
                    document.querySelector('.card .desc').innerHTML = '为保障安全，修改密码需验证原密码<br>密码长度4-20位';
                    document.getElementById('navTitle').textContent = '修改密码';
                } else {
                    oldField.style.display = 'none';
                    newLabel.textContent = '设置密码';
                    confirmLabel.textContent = '确认密码';
                    document.querySelector('.card .title').textContent = '设置工资条密码';
                    document.querySelector('.card .desc').innerHTML = '设置密码后，查看工资条需输入密码验证<br>密码长度4-20位';
                    document.getElementById('navTitle').textContent = '设置密码';
                }
            } catch (e) {
                // 初始化失败时保留 DOM 原有状态，避免误隐藏已设置的字段
            }
        })();
    </script>
