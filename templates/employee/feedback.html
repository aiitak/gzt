    <script>
        document.addEventListener('DOMContentLoaded', async function() {
            const resp = await fetch('/api/auth/me');
            if (resp.status === 401) {
                const redirect = encodeURIComponent(window.location.pathname);
                window.location.href = '/api/auth/login?redirect=' + redirect;
                return;
            }
            const me = await resp.json();
            if (me.password_set === false) {
                window.location.href = '/employee/password';
                return;
            }
            await loadFeedback();
            handleHash();

            const urlParams = new URLSearchParams(window.location.search);
            const preYM = urlParams.get('ym');
            const preBonusId = urlParams.get('bonus_id');
            const preBonusYear = urlParams.get('bonus_year');
            const preBonusType = urlParams.get('bonus_type');
            if (preBonusId) {
                var bonusInfo = null;
                if (preBonusYear) {
                    bonusInfo = { year: preBonusYear, bonus_type: preBonusType };
                }
                setTimeout(() => newFeedback(null, parseInt(preBonusId), bonusInfo), 300);
            } else if (preYM) {
                setTimeout(() => newFeedback(preYM), 300);
            }
        });

        const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({
            '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
        }[c]));

        let _allFeedback = [];
        let _visibleGroups = 0;
        const GROUP_STEP = 3;

        async function loadFeedback() {
            try {
                const resp = await fetch('/api/feedback/my');
                const data = await resp.json();
                if (data.need_password) {
                    if (data.need_setup) {
                        window.location.href = '/employee/password';
                    } else {
                        showPasswordOverlay('查看反馈信息需要验证密码');
                    }
                    return;
                }
                _allFeedback = data || [];
                _visibleGroups = 0;
                renderFeedback();
            } catch (e) {
                document.getElementById('feedbackList').innerHTML = '<div class="empty"><div class="icon">⚠️</div><div>加载失败</div></div>';
            }
        }

        function renderFeedback() {
            const container = document.getElementById('feedbackList');
            container.className = '';
            container.innerHTML = '';

            if (!_allFeedback.length) {
                container.innerHTML = '<div class="empty"><div class="icon">📭</div><div>暂无反馈记录</div></div>';
                return;
            }

            // 统计
            const total = _allFeedback.length;
            const pending = _allFeedback.filter(f => f.status !== 'replied').length;
            const replied = total - pending;

            // 汇总栏
            const summary = document.createElement('div');
            summary.className = 'feedback-summary';
            summary.innerHTML = `
                <div class="sum-item total"><div class="sum-num">${total}</div><div class="sum-label">总反馈</div></div>
                <div class="sum-item pending"><div class="sum-num">${pending}</div><div class="sum-label">待处理</div></div>
                <div class="sum-item replied"><div class="sum-num">${replied}</div><div class="sum-label">已回复</div></div>
            `;
            container.appendChild(summary);

            // 按月份分组
            const groups = {};
            const groupOrder = [];
            _allFeedback.forEach(item => {
                const ym = item.year_month || '';
                if (!groups[ym]) {
                    groups[ym] = [];
                    groupOrder.push(ym);
                }
                groups[ym].push(item);
            });

            // 先显示前 GROUP_STEP 组，第一个默认展开，其余折叠
            const showCount = Math.min(_visibleGroups + GROUP_STEP, groupOrder.length);
            groupOrder.slice(0, showCount).forEach((ym, idx) => {
                container.appendChild(createMonthGroup(ym, groups[ym], idx === 0));
            });
            _visibleGroups = showCount;

            // 加载更多
            if (_visibleGroups < groupOrder.length) {
                const loadMore = document.createElement('div');
                loadMore.className = 'load-more';
                loadMore.textContent = `加载更多（剩余 ${groupOrder.length - _visibleGroups} 个月份）`;
                loadMore.onclick = loadMoreGroups;
                container.appendChild(loadMore);
            }
        }

        async function handleHash() {
            const hash = window.location.hash;
            if (!hash || !hash.startsWith('#feedback-')) return;
            const targetId = hash.replace('#feedback-', '');
            let targetCard = document.getElementById('feedback-' + targetId);

            // 如果目标卡片未渲染（在未加载的分组中），继续加载更多
            const groupOrder = getGroupOrder();
            while (!targetCard && _visibleGroups < groupOrder.length) {
                loadMoreGroups();
                targetCard = document.getElementById('feedback-' + targetId);
            }

            if (!targetCard) return;

            // 展开包含该卡片的月份分组
            const monthGroup = targetCard.closest('.month-group');
            if (monthGroup && monthGroup.classList.contains('collapsed')) {
                monthGroup.classList.remove('collapsed');
            }

            // 高亮目标卡片
            targetCard.classList.add('target-highlight');

            // 滚动到目标位置（延迟一帧确保展开动画完成）
            setTimeout(() => {
                const navBarHeight = document.querySelector('.nav-bar')?.offsetHeight || 0;
                const y = targetCard.getBoundingClientRect().top + window.pageYOffset - navBarHeight - 20;
                window.scrollTo({ top: y, behavior: 'smooth' });
            }, 100);
        }

        function getGroupKey(item) {
            if (item.bonus && item.bonus.id) {
                return 'bonus_' + item.bonus.year + '_' + item.bonus.bonus_type;
            }
            return item.year_month || '';
        }

        function getGroupLabel(item) {
            if (item.bonus && item.bonus.id) {
                return item.bonus.year + '年 ' + item.bonus.bonus_type + ' 奖金';
            }
            const ym = item.year_month || '';
            return ym ? (ym.slice(0,4) + '年' + ym.slice(4,6) + '月') : '通用反馈';
        }

        function getGroupOrder() {
            const groupOrder = [];
            const seen = new Set();
            _allFeedback.forEach(item => {
                const key = getGroupKey(item);
                if (!seen.has(key)) {
                    seen.add(key);
                    groupOrder.push(key);
                }
            });
            return groupOrder;
        }

        function getGroupItems(key) {
            return _allFeedback.filter(item => getGroupKey(item) === key);
        }

        // 加载更多分组（供 renderFeedback 和 handleHash 复用，避免 arguments.callee 在箭头函数中失效）
        function loadMoreGroups() {
            const groupOrder = getGroupOrder();
            const nextCount = Math.min(_visibleGroups + GROUP_STEP, groupOrder.length);
            const frag = document.createDocumentFragment();
            groupOrder.slice(_visibleGroups, nextCount).forEach(ym => {
                frag.appendChild(createMonthGroup(ym, getGroupItems(ym)));
            });
            _visibleGroups = nextCount;
            const oldBtn = document.querySelector('.load-more');
            if (oldBtn) oldBtn.remove();
            document.getElementById('feedbackList').appendChild(frag);
            if (_visibleGroups < groupOrder.length) {
                const newBtn = document.createElement('div');
                newBtn.className = 'load-more';
                newBtn.textContent = `加载更多（剩余 ${groupOrder.length - _visibleGroups} 个月份）`;
                newBtn.onclick = loadMoreGroups;
                document.getElementById('feedbackList').appendChild(newBtn);
            }
        }

        function createMonthGroup(key, items, expanded) {
            const group = document.createElement('div');
            group.className = 'month-group' + (expanded ? '' : ' collapsed');

            const ymLabel = getGroupLabel(items[0]);
            const pendingCount = items.filter(i => i.status !== 'replied').length;

            group.innerHTML = `
                <div class="month-header" onclick="this.parentElement.classList.toggle('collapsed')">
                    <div class="mh-left">
                        <span class="mh-icon">▼</span>
                        <span class="mh-title">${ymLabel}</span>
                    </div>
                    <span class="mh-count">${items.length}条${pendingCount > 0 ? ' · ' + pendingCount + '待处理' : ''}</span>
                </div>
                <div class="month-body"></div>
            `;

            const body = group.querySelector('.month-body');
            items.forEach(item => {
                const card = document.createElement('div');
                card.className = 'feedback-card';
                card.id = 'feedback-' + item.id;
                const statusClass = item.status === 'replied' ? 'replied' : 'pending';
                const statusText = item.status === 'replied' ? '已回复' : '待处理';
                
                let repliesHtml = '';
                if (item.replies && item.replies.length > 0) {
                    repliesHtml = item.replies.map(r => `
                        <div class="reply">
                            <div class="label">${r.reply_name ? esc(r.reply_name) + ' 回复：' : '回复：'}</div>
                            <div class="reply-content">${esc(r.content)}</div>
                            <div class="reply-time">${esc(r.created_at || '')}</div>
                        </div>
                    `).join('');
                }
                
                card.innerHTML = `
                    <div class="header">
                        <span>${esc(item.created_at || '')}</span>
                        <span class="status-badge ${statusClass}">${statusText}</span>
                    </div>
                    <div class="content">${esc(item.content)}</div>
                    ${repliesHtml}
                `;
                body.appendChild(card);
            });

            return group;
        }

        function newFeedback(preSelectYM, preBonusId, preBonusInfo) {
            var isBonus = preBonusId && preBonusId > 0;
            var contextHtml = '';
            if (isBonus) {
                var bonusLabel = preBonusInfo && preBonusInfo.year
                    ? (preBonusInfo.year + '年 ' + (preBonusInfo.bonus_type || ''))
                    : ('奖金记录 #' + preBonusId);
                contextHtml = '<div id="bonusContext" style="padding:8px 12px;margin-bottom:10px;background:#e8f5e9;border-radius:6px;font-size:13px;color:#2e7d32;">📌 关联：' + esc(bonusLabel) + '</div>';
            }
            var selectHtml = isBonus ? '' : '<select id="newFeedbackMonth" style="width:100%;padding:8px;margin-bottom:10px;border:1px solid #d9d9d9;border-radius:4px;font-size:14px;box-sizing:border-box;background:#fff;color:#333;"><option value="">（不关联具体记录）</option></select>';

            var $dialog = weui.dialog({
                title: '提交反馈',
                content: '<div style="padding:10px 0;">' + contextHtml + selectHtml + '<textarea id="newFeedbackText" rows="4" style="width:100%;padding:8px;border:1px solid #d9d9d9;border-radius:4px;box-sizing:border-box;font-size:14px;outline:none;resize:none;" placeholder="请描述您的问题"></textarea></div>',
                className: 'feedback-dialog',
                buttons: [
                    {
                        label: '取消',
                        type: 'default',
                        onClick: function() { $dialog.hide(); }
                    },
                    {
                        label: '提交',
                        type: 'primary',
                        onClick: async function() {
                            var textEl = document.getElementById('newFeedbackText');
                            var text = textEl ? textEl.value : '';
                            if (!text || !text.trim()) {
                                weui.topTips('请输入内容');
                                return false;
                            }
                            $dialog.hide();
                            try {
                                var body = {
                                    content: text.trim()
                                };
                                if (isBonus) {
                                    body.bonus_id = preBonusId;
                                } else {
                                    var selVal = (document.getElementById('newFeedbackMonth') || {}).value || '';
                                    if (selVal.startsWith('bonus_')) {
                                        body.bonus_id = parseInt(selVal.substring(7));
                                    } else {
                                        body.year_month = selVal;
                                    }
                                }
                                const resp = await fetch('/api/feedback/submit', {
                                    method: 'POST',
                                    headers: {'Content-Type': 'application/json'},
                                    body: JSON.stringify(body)
                                });
                                const data = await resp.json();
                                if (data.success) {
                                    weui.toast('✅ 已提交', 1500);
                                    setTimeout(loadFeedback, 1500);
                                } else {
                                    weui.topTips(data.error || '提交失败');
                                }
                            } catch (e) {
                                weui.topTips('网络错误');
                            }
                        }
                    }
                ]
            });
            setTimeout(function() {
                var el = document.getElementById('newFeedbackText');
                if (el) el.focus();
                if (!isBonus) {
                    var sel = document.getElementById('newFeedbackMonth');
                    if (sel) {
                        var salaryPromise = fetch('/api/salary/list').then(function(r){ return r.json(); }).catch(function(){ return {list:[]}; });
                        var bonusPromise = fetch('/api/bonus/employee').then(function(r){ return r.json(); }).catch(function(){ return {list:[]}; });
                        Promise.all([salaryPromise, bonusPromise]).then(function(results) {
                            var salData = results[0] || {};
                            var bonusData = results[1] || {};
                            sel.innerHTML = '<option value="">（不关联具体记录）</option>';
                            var salList = salData.list || [];
                            if (salList.length) {
                                var g1 = document.createElement('optgroup');
                                g1.label = '工资条';
                                salList.forEach(function(it){
                                    var o = document.createElement('option');
                                    o.value = it.year_month;
                                    o.textContent = it.year_month.slice(0,4) + '年' + it.year_month.slice(4,6) + '月薪资';
                                    if (preSelectYM && it.year_month === preSelectYM) o.selected = true;
                                    g1.appendChild(o);
                                });
                                sel.appendChild(g1);
                            }
                            var bonusList = [];
                            (bonusData.list || []).forEach(function(gy){
                                (gy.items || []).forEach(function(it){
                                    bonusList.push(it);
                                });
                            });
                            if (bonusList.length) {
                                var g2 = document.createElement('optgroup');
                                g2.label = '奖金记录';
                                bonusList.forEach(function(it){
                                    var o = document.createElement('option');
                                    o.value = 'bonus_' + it.id;
                                    o.textContent = it.year + '年 ' + it.bonus_type;
                                    g2.appendChild(o);
                                });
                                sel.appendChild(g2);
                            }
                        });
                    }
                }
            }, 100);
        }

        function showPasswordOverlay(tip) {
            document.getElementById('passwordOverlay').style.display = 'flex';
            document.getElementById('pwSubtitle').textContent = tip || '查看反馈信息需要验证密码';
            document.getElementById('passwordInput').value = '';
            setTimeout(function() { document.getElementById('passwordInput').focus(); }, 300);
        }

        async function verifyPassword() {
            const pw = document.getElementById('passwordInput').value;
            if (!pw) { weui.topTips('请输入密码'); return; }
            try {
                const resp = await fetch('/api/auth/password/verify', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({password: pw})
                });
                const data = await resp.json();
                if (data.success) {
                    weui.toast('验证成功', 800);
                    setTimeout(function() {
                        document.getElementById('passwordOverlay').style.display = 'none';
                        loadFeedback();
                    }, 800);
                } else if (data.need_setup) {
                    window.location.href = '/employee/password';
                } else {
                    weui.topTips(data.error || '密码错误');
                }
            } catch (e) {
                weui.topTips('网络错误');
            }
        }

        document.getElementById('pwConfirmBtn').addEventListener('click', verifyPassword);
        document.getElementById('passwordInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') verifyPassword();
        });
        document.getElementById('eyeBtn').addEventListener('click', function() {
            const input = document.getElementById('passwordInput');
            if (input.type === 'password') {
                input.type = 'text';
                this.textContent = '🙈';
            } else {
                input.type = 'password';
                this.textContent = '👁';
            }
        });

    </script>
</body>
</html>
