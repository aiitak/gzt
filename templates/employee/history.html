    <script>
        // fmtMoney 安全回退
        if (typeof fmtMoney !== 'function') {
            window.fmtMoney = function(val) {
                return '¥' + parseFloat(val || 0).toFixed(2);
            };
        }
        // HTML 转义，避免后端错误信息中的特殊字符破坏 DOM 或引发 XSS
        function esc(s) { var d = document.createElement('div'); d.textContent = s == null ? '' : String(s); return d.innerHTML; }

        document.addEventListener('DOMContentLoaded', async function() {
            const resp = await fetch('/api/auth/me');
            if (resp.status === 401) {
                const redirect = encodeURIComponent(window.location.pathname);
                window.location.href = '/api/auth/login?redirect=' + redirect;
                return;
            }
            const user = await resp.json();
            if (!user.logged_in) {
                const redirect = encodeURIComponent(window.location.pathname);
                window.location.href = '/api/auth/login?redirect=' + redirect;
                return;
            }
            loadHistory();
        });

        async function loadHistory() {
            try {
                const resp = await fetch('/api/salary/history');
                if (resp.status === 401) {
                    const redirect = encodeURIComponent(window.location.pathname);
                    window.location.href = '/api/auth/login?redirect=' + redirect;
                    return;
                }
                if (!resp.ok) {
                    document.getElementById('historyList').innerHTML = '<div class="empty"><div class="icon">⚠️</div><div>加载失败 (HTTP ' + resp.status + ')</div></div>';
                    return;
                }
                const data = await resp.json();
                if (data.success === false && data.error) {
                    document.getElementById('historyList').innerHTML = '<div class="empty"><div class="icon">⚠️</div><div>' + esc(data.error || '加载失败') + '</div></div>';
                    return;
                }
                // 未设置密码 -> 引导设置
                if (data.need_password && data.need_setup) {
                    window.location.href = '/employee/password';
                    return;
                }
                // 需要验证密码 -> 跳详情页
                if (data.need_password) {
                    window.location.href = '/employee/detail';
                    return;
                }
                const container = document.getElementById('historyList');
                container.className = '';
                container.innerHTML = '';

                if (!data || !data.success || !data.list || data.list.length === 0) {
                    container.innerHTML = '<div class="empty"><div class="icon">📭</div><div>暂无工资记录</div></div>';
                    return;
                }

                let currentYear = '';
                let yearCount = 0;
                const curYearStr = String(new Date().getFullYear());
                data.list.forEach(item => {
                    const ym = item.year_month;
                    const year = ym.slice(0, 4);
                    const month = ym.slice(4, 6);

                    if (year !== currentYear) {
                        currentYear = year;
                        yearCount++;
                        const yearGroup = document.createElement('div');
                        yearGroup.className = 'year-group';
                        yearGroup.dataset.year = year;
                        const yid = 'ye_' + year;
                        // 默认只展开最近2年（当前年 + 上一年），其他年份折叠
                        const diff = parseInt(curYearStr) - parseInt(year);
                        const isCollapsed = diff > 1;
                        if (isCollapsed) {
                            yearGroup.classList.add('collapsed');
                        }
                        // 默认隐藏所有金额（histBlur = true 表示已模糊）
                        window._hEyeState = window._hEyeState || {};
                        if (!(yid in window._hEyeState)) {
                            window._hEyeState[yid] = true;
                        }
                        const eyeIcon = window._hEyeState[yid] ? '🙈' : '👁';
                        yearGroup.innerHTML = `
                            <div class="year-header" onclick="toggleYear('${yid}', event)">
                                <span class="year-title"><span class="arrow">▼</span>${year}年</span>
                                <span class="h-eye" onclick="toggleYearEye('${yid}', event)" title="显示/隐藏金额">${eyeIcon}</span>
                            </div>`;
                        container.appendChild(yearGroup);
                    }

                    const itemEl = document.createElement('div');
                    itemEl.className = 'salary-item';
                    itemEl.onclick = function() {
                        window.location.href = '/employee/detail?ym=' + ym;
                    };
                    const yid = 'ye_' + year;
                    const isBlur = window._hEyeState && window._hEyeState[yid];
                    itemEl.innerHTML = `
                        <div class="month">${year}年${month}月薪资</div>
                        <div class="pay">实发金额：<span class="amount amt-${yid}${isBlur ? ' hist-blur' : ''}">${fmtMoney(item.real_pay || 0)}</span>元</div>
                    `;
                    const lastGroup = container.lastElementChild;
                    if (lastGroup && lastGroup.classList.contains('year-group')) {
                        lastGroup.appendChild(itemEl);
                    }
                });
            } catch (e) {
                console.error('loadHistory error', e);
                document.getElementById('historyList').innerHTML = '<div class="empty"><div class="icon">⚠️</div><div>加载失败：' + String(e.message || e).replace(/[<>&]/g, function(c){return {'<':'&lt;','>':'&gt;','&':'&amp;'}[c];}) + '</div></div>';
            }
        }

        // ===== 工资记录按年份折叠/展开（点击标题行或箭头切换） =====
        function toggleYear(yid, ev) {
            // 眼睛按钮点击由 toggleYearEye 处理，此处需阻止冒泡
            if (ev && ev.target && ev.target.classList.contains('h-eye')) return;
            const yearGroup = ev.target.closest('.year-group');
            if (!yearGroup) return;
            yearGroup.classList.toggle('collapsed');
        }

        // ===== 按年份显示/隐藏金额（点击眼睛按钮） =====
        window._hEyeState = window._hEyeState || {};
        function toggleYearEye(yid, ev) {
            if (ev) {
                ev.stopPropagation();
                ev.preventDefault();
            }
            window._hEyeState[yid] = !window._hEyeState[yid];
            // 更新眼睛图标
            const yearGroup = document.querySelector('.year-group[data-year="' + yid.replace('ye_', '') + '"]');
            if (yearGroup) {
                const eye = yearGroup.querySelector('.h-eye');
                if (eye) eye.textContent = window._hEyeState[yid] ? '🙈' : '👁';
            }
            // 更新所有该年金额的模糊状态
            document.querySelectorAll('.amt-' + yid).forEach(el => {
                if (window._hEyeState[yid]) el.classList.add('hist-blur');
                else el.classList.remove('hist-blur');
            });
        }
    </script>
