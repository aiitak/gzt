    <script>
        // fmtMoney 安全回退
        if (typeof fmtMoney !== 'function') {
            window.fmtMoney = function(val) {
                return '¥' + parseFloat(val || 0).toFixed(2);
            };
        }

        const params = new URLSearchParams(window.location.search);
        let ym = params.get('ym') || '';
        let salaryData = null;
        let allYMList = []; // 所有可用的年月列表（从新到旧）

        document.addEventListener('DOMContentLoaded', async function() {
            // 加载工资列表（用于月份切换器）
            const listOk = await loadSalaryList();
            if (listOk === 'need_auth') return; // 已显示密码/设置遮罩，不再继续
            if (!ym) {
                // 没有 ym 参数时默认取最新一条
                if (allYMList.length > 0) {
                    ym = allYMList[0];
                } else {
                    document.getElementById('salaryDetail').innerHTML = '<div class="empty"><div class="icon">⚠️</div><div>暂无工资</div></div>';
                    document.getElementById('salaryDetail').className = '';
                    return;
                }
            }
            await loadDetail();
        });

        async function loadSalaryList() {
            try {
                const resp = await fetch('/api/salary/list');
                if (resp.status === 401) {
                    const redirect = encodeURIComponent(window.location.pathname + window.location.search);
                    window.location.href = '/api/auth/login?redirect=' + redirect;
                    return 'need_auth';
                }
                const data = await resp.json();
                if (data.need_password && data.need_setup) {
                    showSetupOverlay();
                    return 'need_auth';
                }
                if (data.need_password) {
                    showPasswordOverlay('查看工资需要验证密码');
                    return 'need_auth';
                }
                if (data.success && data.list) {
                    allYMList = data.list.map(r => r.year_month);
                    fillMonthSwitcher();
                }
                return 'ok';
            } catch (e) {
                console.error('loadSalaryList error', e);
                return 'error';
            }
        }

        function fillMonthSwitcher() {
            const sel = document.getElementById('monthSelect');
            if (!sel || !allYMList.length) return;
            sel.innerHTML = '';
            allYMList.forEach(m => {
                const y = m.slice(0, 4);
                const mm = m.slice(4, 6);
                const opt = document.createElement('option');
                opt.value = m;
                opt.textContent = y + '年' + mm + '月';
                if (m === ym) opt.selected = true;
                sel.appendChild(opt);
            });
            document.getElementById('monthSwitcher').style.display = 'flex';
            updateNavButtons();
        }

        function updateNavButtons() {
            const idx = allYMList.indexOf(ym);
            const prevBtn = document.getElementById('prevBtn');
            const nextBtn = document.getElementById('nextBtn');
            // 语义翻转：左‹ = 上个月（更早，idx+1方向），到数组末尾（最旧）才禁用；右› = 下个月（更晚，idx-1方向），到数组开头（最新）才禁用
            prevBtn.disabled = idx === -1 || idx >= allYMList.length - 1;
            nextBtn.disabled = idx <= 0 || idx === -1;
        }

        function goMonth(delta) {
            const idx = allYMList.indexOf(ym);
            if (idx === -1) return;
            const newIdx = idx + delta;
            if (newIdx < 0 || newIdx >= allYMList.length) return;
            const newYM = allYMList[newIdx];
            ym = newYM;
            // 更新 URL（不刷新）
            const url = new URL(window.location.href);
            url.searchParams.set('ym', ym);
            window.history.replaceState({}, '', url.toString());
            fillMonthSwitcher();
            loadDetail();
        }

        function onMonthSelectChange() {
            const newYM = document.getElementById('monthSelect').value;
            if (!newYM || newYM === ym) return;
            ym = newYM;
            const url = new URL(window.location.href);
            url.searchParams.set('ym', ym);
            window.history.replaceState({}, '', url.toString());
            updateNavButtons();
            loadDetail();
        }

        async function loadDetail() {
            document.getElementById('salaryDetail').className = 'loading';
            document.getElementById('salaryDetail').innerHTML = '加载中...';
            try {
                const resp = await fetch('/api/salary/detail/' + ym);
                if (resp.status === 401) {
                    const redirect = encodeURIComponent('/employee/detail?ym=' + ym);
                    window.location.href = '/api/auth/login?redirect=' + redirect;
                    return;
                }
                const data = await resp.json();

                if (data.need_password) {
                    if (data.need_setup) {
                        showSetupOverlay();
                    } else {
                        showPasswordOverlay('查看工资需要验证密码');
                    }
                    return;
                }

                if (!data.success) {
                    document.getElementById('salaryDetail').className = '';
                    document.getElementById('salaryDetail').innerHTML = '<div class="empty"><div class="icon">⚠️</div><div>' + esc(data.error || '加载失败') + '</div></div>';
                    return;
                }

                salaryData = data;
                renderDetail(data);
            } catch (e) {
                console.error('loadDetail error', e);
                document.getElementById('salaryDetail').className = '';
                document.getElementById('salaryDetail').innerHTML = '<div class="empty"><div class="icon">⚠️</div><div>加载失败：' + esc(e.message || e) + '</div></div>';
            }
        }

        function renderDetail(data) {
            document.getElementById('mainContent').style.display = 'block';
            document.getElementById('passwordOverlay').style.display = 'none';
            document.getElementById('passwordInput').placeholder = '请输入密码';

            document.getElementById('empName').textContent = '亲爱的' + (data.name || '同事').trim() + '您辛苦了';
            // 顶部卡片的 ￥ 由 HTML 里的小 ￥ span 承担，这里只写纯数字（避免 fmtMoney 再带一个 ￥）
            (function() {
                var n = parseFloat(data.total_salary || 0);
                if (isNaN(n)) n = 0;
                document.getElementById('realPay').textContent = n.toFixed(2);
                fitAmountFont(document.getElementById('realPay'));
            })();

            const statusEl = document.getElementById('statusBadge');
            if (data.confirmed) {
                statusEl.textContent = '✅ 已确认';
                statusEl.style.background = 'rgba(255,255,255,0.3)';
            } else {
                statusEl.textContent = '⏳ 待确认';
            }

            // 渲染明细
            const container = document.getElementById('salaryDetail');
            container.className = '';
            container.innerHTML = '';

            const items = data.items || [];
            if (!items.length) {
                container.innerHTML = '<div class="empty"><div class="icon">📭</div><div>暂无工资明细</div></div>';
                document.getElementById('actionBar').style.display = 'none';
                return;
            }

            // 按 category 分组
            const groups = {};
            const groupOrder = [];
            items.forEach(item => {
                const cat = item.category || '';
                if (!groups[cat]) {
                    groups[cat] = [];
                    groupOrder.push(cat);
                }
                groups[cat].push(item);
            });

            // 扣除项显示为负数（后端存正数），收入项保持正数
            var fmtDetailNum = (function() {
                if (typeof fmtDetailNumCache === 'function') return fmtDetailNumCache;
                return function(v, isDeduction) {
                    var n = parseFloat(v);
                    if (isNaN(n)) n = 0;
                    if (isDeduction) n = -Math.abs(n);
                    return n.toFixed(2);
                };
            })();
            groupOrder.forEach(cat => {
                const groupItems = groups[cat];
                const groupCard = document.createElement('div');
                groupCard.className = 'group-card';

                if (!cat) {
                    // 无分组的项目直接平铺
                    groupItems.forEach(item => {
                        const row = document.createElement('div');
                        row.className = 'item-row';
                        const isDed = item.is_deduction;
                        row.innerHTML = `
                            <span class="item-name">${esc(item.item_name)}</span>
                            <span class="item-value amt-val ${isDed ? 'deduction' : ''} ${_state.detailShow ? '' : 'detail-blur'}">${fmtDetailNum(item.item_value, isDed)}</span>
                        `;
                        groupCard.appendChild(row);
                    });
                } else if (groupItems.length === 1 && groupItems[0].item_name === cat) {
                    // 分组只有一项且名称与分组名相同，按单条样式显示
                    const item = groupItems[0];
                    const row = document.createElement('div');
                    row.className = 'single-item';
                    const isDed = item.is_deduction;
                    row.innerHTML = `
                        <span>${esc(cat)}</span>
                        <span class="value amt-val ${isDed ? 'deduction' : ''} ${_state.detailShow ? '' : 'detail-blur'}">${fmtDetailNum(item.item_value, isDed)}</span>
                    `;
                    groupCard.appendChild(row);
                } else {
                    // 显示分组标题和项目列表
                    const header = document.createElement('div');
                    const level = getGroupLevel(cat);
                    header.className = 'group-header level-' + level;
                    header.textContent = cat;
                    groupCard.appendChild(header);

                    groupItems.forEach(item => {
                        const row = document.createElement('div');
                        row.className = 'item-row';
                        const isDed = item.is_deduction;
                        row.innerHTML = `
                            <span class="item-name">${esc(item.item_name)}</span>
                            <span class="item-value amt-val ${isDed ? 'deduction' : ''} ${_state.detailShow ? '' : 'detail-blur'}">${fmtDetailNum(item.item_value, isDed)}</span>
                        `;
                        groupCard.appendChild(row);
                    });
                }

                container.appendChild(groupCard);
            });

            // 已确认时隐藏"确认签收"，仅保留"我要反馈"
            document.getElementById('confirmBtn').style.display = data.confirmed ? 'none' : '';
            document.getElementById('actionBar').style.display = 'flex';
        }

        function getGroupLevel(category) {
            const parts = category.split('/');
            return Math.min(parts.length, 3);
        }

        function showPasswordOverlay(tip) {
            document.getElementById('passwordOverlay').style.display = 'flex';
            document.getElementById('pwTitle').textContent = '请输入密码';
            document.getElementById('pwSubtitle').textContent = tip || '查看工资需要验证密码';
            document.getElementById('passwordInput').value = '';
            document.getElementById('pwConfirmBtn').textContent = '确认';
            document.getElementById('pwConfirmBtn').onclick = verifyPassword;
            document.getElementById('pwSetupBtn').style.display = 'none';
            setTimeout(() => { document.getElementById('passwordInput').focus(); }, 300);
        }

        function showSetupOverlay() {
            document.getElementById('passwordOverlay').style.display = 'flex';
            document.getElementById('pwTitle').textContent = '🔐 设置密码';
            document.getElementById('pwSubtitle').textContent = '首次使用请先设置密码';
            document.getElementById('passwordInput').value = '';
            document.getElementById('passwordInput').placeholder = '请设置4-20位密码';
            document.getElementById('pwConfirmBtn').textContent = '设置密码';
            document.getElementById('pwConfirmBtn').onclick = setupPassword;
            document.getElementById('pwSetupBtn').style.display = 'none';
            setTimeout(() => { document.getElementById('passwordInput').focus(); }, 300);
        }

        async function verifyPassword() {
            const pw = document.getElementById('passwordInput').value;
            if (!pw) { weui.topTips('请输入密码'); return; }
            try {
                const resp = await fetch('/api/auth/password/verify', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({password: pw})
                });
                const data = await resp.json();
                if (data.success) {
                    weui.toast('验证成功', 800);
                    setTimeout(async () => {
                        // 先隐藏密码遮罩，避免无工资数据时卡住
                        document.getElementById('passwordOverlay').style.display = 'none';
                        const r = await loadSalaryList();
                        if (r === 'need_auth') return; // 异常：cookie 未生效，遮罩已由 loadSalaryList 重新显示
                        if (!ym && allYMList.length > 0) ym = allYMList[0];
                        if (ym) {
                            loadDetail();
                        } else {
                            // 暂无工资数据，显示空态
                            const sd = document.getElementById('salaryDetail');
                            sd.className = '';
                            sd.innerHTML = '<div class="empty"><div class="icon">📭</div><div>暂无工资</div></div>';
                            document.getElementById('mainContent').style.display = 'block';
                        }
                    }, 800);
                } else if (data.need_setup) {
                    showSetupOverlay();
                } else {
                    weui.topTips(data.error || '密码错误');
                }
            } catch (e) {
                weui.topTips('网络错误');
            }
        }

        async function setupPassword() {
            const pw = document.getElementById('passwordInput').value;
            if (pw.length < 4 || pw.length > 20) { weui.topTips('密码长度需4-20位'); return; }
            try {
                const resp = await fetch('/api/auth/password/set', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({password: pw})
                });
                const data = await resp.json();
                if (data.success) {
                    weui.toast('密码设置成功', 1000);
                    setTimeout(async () => {
                        // 先隐藏密码遮罩，避免无工资数据时卡住
                        document.getElementById('passwordOverlay').style.display = 'none';
                        const r = await loadSalaryList();
                        if (r === 'need_auth') return; // 异常情况，遮罩已由 loadSalaryList 重新显示
                        if (!ym && allYMList.length > 0) ym = allYMList[0];
                        if (ym) {
                            loadDetail();
                        } else {
                            const sd = document.getElementById('salaryDetail');
                            sd.className = '';
                            sd.innerHTML = '<div class="empty"><div class="icon">📭</div><div>暂无工资</div></div>';
                            document.getElementById('mainContent').style.display = 'block';
                        }
                    }, 1000);
                } else {
                    weui.topTips(data.error || '设置失败');
                }
            } catch (e) {
                weui.topTips('网络错误');
            }
        }

        async function confirmSalary() {
            weui.confirm('确认后表示您已收到并核实本月工资，确定要确认签收吗？', async function() {
                try {
                    const resp = await fetch('/api/salary/confirm/' + ym, {
                        method: 'POST',
                        headers: {'Content-Type': 'application/json'}
                    });
                    const data = await resp.json();
                    if (data.success) {
                        weui.toast('✅ 确认成功', 1500);
                        setTimeout(() => { loadDetail(); }, 1500);
                    } else if (data.need_password) {
                        weui.topTips('请先验证密码');
                        showPasswordOverlay();
                    } else {
                        weui.topTips(data.error || '操作失败');
                    }
                } catch (e) {
                    weui.topTips('网络错误');
                }
            }, function() {}, { title: '确认签收' });
        }

        function submitFeedback() {
            window.location.href = '/employee/feedback?ym=' + ym;
        }

        // ===== 详情页金额显示/隐藏切换 =====
        // XSS 防护：转义 HTML 特殊字符
        function esc(s) { var d = document.createElement('div'); d.textContent = s == null ? '' : String(s); return d.innerHTML; }
        const _state = {
            detailShow: false, // 详情页所有金额
        };
        function fitAmountFont(el) {
            if (!el) return;
            const len = el.textContent.trim().length;
            if (len <= 8) el.style.fontSize = '36px';
            else if (len <= 12) el.style.fontSize = '30px';
            else if (len <= 15) el.style.fontSize = '24px';
            else el.style.fontSize = '20px';
        }
        function toggleAllAmount() {
            _state.detailShow = !_state.detailShow;
            const eye = document.getElementById('toggleEye');
            if (eye) eye.textContent = _state.detailShow ? '👁' : '🙈';
            // 实发工资
            const realPay = document.getElementById('realPay');
            if (realPay) {
                if (_state.detailShow) realPay.classList.remove('detail-blur');
                else realPay.classList.add('detail-blur');
            }
            // 所有分组明细
            document.querySelectorAll('.amt-val').forEach(el => {
                if (_state.detailShow) el.classList.remove('detail-blur');
                else el.classList.add('detail-blur');
            });
        }

        // 密码显示切换
        document.getElementById('eyeBtn').addEventListener('click', function() {
            const input = document.getElementById('passwordInput');
            if (input.type === 'password') {
                input.type = 'text';
                this.textContent = '🙈';
            } else {
                input.type = 'password';
                this.textContent = '👁';
            }
        });

        document.getElementById('passwordInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') verifyPassword();
        });
    </script>
</body>
</html>
