    <script>
        let currentUser = null;
        let currentBonusId = null;
        let currentBonusInfo = null; // {year, bonus_type}
        // 金额默认隐藏（与工资条首页/详情页行为一致）
        const _state = { amountShow: false, detailShow: false };

        document.addEventListener('DOMContentLoaded', async function() {
            await checkLogin();
        });

        /**
         * 检查登录状态，未登录跳转登录页
         */
        async function checkLogin() {
            try {
                const resp = await fetch('/api/auth/me');
                if (resp.status === 401) {
                    window.location.href = '/api/auth/login?redirect=/employee/bonus';
                    return;
                }
                currentUser = await resp.json();
                if (!currentUser.logged_in) {
                    window.location.href = '/api/auth/login?redirect=/employee/bonus';
                    return;
                }
                if (!currentUser.password_set) {
                    window.location.href = '/employee/password';
                    return;
                }
                loadBonusList();
            } catch (e) {
                console.error('checkLogin error', e);
                weui.topTips('获取用户信息失败');
            }
        }

        /**
         * 加载奖金列表（按年份分组）
         */
        async function loadBonusList() {
            try {
                const resp = await fetch('/api/bonus/employee');
                if (resp.status === 401) {
                    window.location.href = '/api/auth/login?redirect=/employee/bonus';
                    return;
                }
                const data = await resp.json();
                if (data.need_password) {
                    if (data.need_setup) {
                        window.location.href = '/employee/password';
                    } else {
                        showPasswordOverlay('查看奖金信息需要验证密码');
                    }
                    return;
                }
                if (!data.success) {
                    weui.topTips(data.error || '加载失败');
                    return;
                }
                document.getElementById('mainContent').style.display = 'block';
                renderBonusList(data.list || []);

                // 从企微推送链接带 ?id=xxx 进入时，自动打开对应奖金详情
                const urlParams = new URLSearchParams(window.location.search);
                const targetId = parseInt(urlParams.get('id'), 10);
                if (targetId > 0) {
                    // 列表渲染完成后延时打开详情，确保 DOM 就绪
                    setTimeout(function() { openDetail(targetId); }, 200);
                }
            } catch (e) {
                console.error('loadBonusList error', e);
                weui.topTips('加载奖金数据失败');
            }
        }

        /**
         * 渲染按年份分组的奖金列表
         */
        function renderBonusList(list) {
            const container = document.getElementById('bonusList');
            container.className = '';
            container.innerHTML = '';

            if (!list.length) {
                container.innerHTML = '<div class="empty"><div class="icon">🎁</div><div>暂无奖金记录</div></div>';
                return;
            }

            list.forEach(yearGroup => {
                const yg = document.createElement('div');
                yg.className = 'year-group';
                yg.dataset.year = yearGroup.year;

                const yearHeader = document.createElement('div');
                yearHeader.className = 'year-header';
                yearHeader.onclick = function() { yg.classList.toggle('collapsed'); };
                yearHeader.innerHTML =
                    '<div class="y-left">' +
                        '<span class="arrow">▼</span>' +
                        '<span>' + esc(yearGroup.year) + '年</span>' +
                    '</div>' +
                    '<div style="display:flex;align-items:center;gap:8px;">' +
                        '<div class="y-total' + (_state.amountShow ? '' : ' blur-amount') + '">¥' + fmtNum(yearGroup.total) + '</div>' +
                    '</div>';
                yg.appendChild(yearHeader);

                const yearContent = document.createElement('div');
                yearContent.className = 'year-content';

                (yearGroup.items || []).forEach(item => {
                    const card = document.createElement('div');
                    card.className = 'bonus-card';
                    card.onclick = function() { openDetail(item.id); };

                    const statusText = item.confirmed ? '✅ 已确认' : '⏳ 待确认';
                    const statusClass = item.confirmed ? 'confirmed' : 'pending';

                    card.innerHTML =
                        '<div class="bc-top">' +
                            '<div class="bc-type">' + esc(item.bonus_type) + '</div>' +
                            '<div class="bc-status ' + statusClass + '">' + statusText + '</div>' +
                        '</div>' +
                        '<div class="bc-amount-row">' +
                            '<div class="bc-amount' + (_state.amountShow ? '' : ' blur-amount') + '"><span class="currency">¥</span>' + fmtNum(item.amount) + '</div>' +
                            '<a href="javascript:;" class="toggle-eye-btn bc-eye" onclick="event.stopPropagation();toggleAmount()" data-card-eye="1" title="显示/隐藏金额">' + (_state.amountShow ? '👁' : '🙈') + '</a>' +
                        '</div>';
                    yearContent.appendChild(card);
                });

                yg.appendChild(yearContent);
                container.appendChild(yg);
            });
        }

        /**
         * 打开奖金详情视图并加载数据（内嵌视图切换，与工资详情页一致）
         */
        async function openDetail(id) {
            currentBonusId = id;
            // 切换视图：隐藏列表，显示详情
            document.getElementById('listView').style.display = 'none';
            document.getElementById('detailView').style.display = 'block';
            document.getElementById('detailItems').className = 'loading';
            document.getElementById('detailItems').innerHTML = '加载中...';
            document.getElementById('actionBar').style.display = 'none';
            // 更新 URL 以支持刷新保持详情
            const url = new URL(window.location.href);
            url.searchParams.set('id', id);
            window.history.replaceState({}, '', url.toString());
            // 滚动到顶部
            window.scrollTo(0, 0);

            try {
                const resp = await fetch('/api/bonus/detail/' + id);
                if (resp.status === 401) {
                    window.location.href = '/api/auth/login?redirect=/employee/bonus';
                    return;
                }
                const data = await resp.json();
                if (data.need_password) {
                    // 需要密码时回到列表视图
                    document.getElementById('listView').style.display = 'block';
                    document.getElementById('detailView').style.display = 'none';
                    if (data.need_setup) {
                        window.location.href = '/employee/password';
                    } else {
                        showPasswordOverlay('查看奖金详情需要验证密码');
                    }
                    return;
                }
                if (!data.success) {
                    document.getElementById('detailItems').className = '';
                    document.getElementById('detailItems').innerHTML = '<div class="empty"><div class="icon">⚠️</div><div>' + esc(data.error || '加载失败') + '</div></div>';
                    return;
                }
                renderDetail(data);
            } catch (e) {
                console.error('openDetail error', e);
                document.getElementById('detailItems').className = '';
                document.getElementById('detailItems').innerHTML = '<div class="empty"><div class="icon">⚠️</div><div>加载失败</div></div>';
            }
        }

        /**
         * 渲染奖金详情：顶部信息卡 + 按 category 分组的明细
         */
        function renderDetail(data) {
            const bonus = data.bonus || {};
            const items = data.items || [];
            currentBonusInfo = { year: bonus.year, bonus_type: bonus.bonus_type };

            document.getElementById('detailType').textContent = (bonus.year ? bonus.year + '年' : '') + (bonus.bonus_type || '—');
            const amtEl = document.getElementById('detailAmount');
            amtEl.textContent = fmtNum(bonus.amount);
            fitAmountFont(amtEl);
            // 详情打开时重置为隐藏状态
            _state.detailShow = false;
            amtEl.classList.add('blur-amount');
            const detailEye = document.getElementById('detailEye');
            if (detailEye) detailEye.textContent = '🙈';

            const statusEl = document.getElementById('detailStatus');
            statusEl.textContent = bonus.confirmed ? '✅ 已确认' : '⏳ 待确认';

            const container = document.getElementById('detailItems');
            container.className = '';
            container.innerHTML = '';

            // 过滤：排除"实发奖金"项和 0 值项
            const filtered = items.filter(item => {
                if (String(item.item_name).indexOf('实发奖金') !== -1) return false;
                if (parseNum(item.item_value) === 0) return false;
                return true;
            });

            if (!filtered.length) {
                container.innerHTML = '<div class="empty"><div class="icon">📭</div><div>暂无明细项</div></div>';
                document.getElementById('actionBar').style.display = 'none';
                return;
            }

            // 按 category 分组
            const groups = {};
            const groupOrder = [];
            filtered.forEach(item => {
                const cat = item.category || '';
                if (!groups[cat]) {
                    groups[cat] = [];
                    groupOrder.push(cat);
                }
                groups[cat].push(item);
            });

            groupOrder.forEach(cat => {
                const groupItems = groups[cat];
                const groupCard = document.createElement('div');
                groupCard.className = 'group-card';

                if (!cat) {
                    // 无分组名：直接平铺
                    groupItems.forEach(item => groupCard.appendChild(createItemRow(item)));
                } else {
                    const header = document.createElement('div');
                    header.className = 'group-header ' + getGroupType(groupItems);
                    header.textContent = cat;
                    groupCard.appendChild(header);
                    groupItems.forEach(item => groupCard.appendChild(createItemRow(item)));
                }

                container.appendChild(groupCard);
            });

            // 备注卡片（空则不显示）
            var remark = (bonus.remark || '').trim();
            if (remark) {
                var rc = document.createElement('div');
                rc.className = 'remark-card';
                rc.innerHTML =
                    '<div class="remark-header">📝 备注</div>' +
                    '<div class="remark-body">' + esc(remark) + '</div>';
                container.appendChild(rc);
            }

            // 已确认时隐藏"确认签收"，仅保留"我要反馈"
            document.getElementById('confirmBtn').style.display = bonus.confirmed ? 'none' : '';
            document.getElementById('actionBar').style.display = 'flex';
        }

        /**
         * 创建单条明细行（扣除项显示红色负数）
         */
        function createItemRow(item) {
            const row = document.createElement('div');
            row.className = 'item-row';
            const isDed = item.is_deduction == 1;
            const val = parseNum(item.item_value);
            // 扣除项数据库存正数，前端显示为负数
            const valText = isDed ? '-¥' + fmtNum(Math.abs(val)) : '¥' + fmtNum(val);
            row.innerHTML =
                '<span class="item-name">' + esc(item.item_name) + '</span>' +
                '<span class="item-value ' + (isDed ? 'deduction' : '') + (_state.detailShow ? '' : ' blur-amount') + '">' + valText + '</span>';
            return row;
        }

        /**
         * 判断分组类型：全扣除→deduction，全收入→income，混合→other
         */
        function getGroupType(items) {
            const allDed = items.every(i => i.is_deduction == 1);
            const noneDed = items.every(i => i.is_deduction != 1);
            if (allDed) return 'deduction';
            if (noneDed) return 'income';
            return 'other';
        }

        /**
         * 关闭详情遮罩并刷新列表（同步确认状态）
         */
        function closeDetail() {
            // 切换视图：隐藏详情，显示列表
            document.getElementById('detailView').style.display = 'none';
            document.getElementById('listView').style.display = 'block';
            // 清除当前详情状态，避免列表页密码验证误判为详情场景
            currentBonusId = null;
            // 清除 URL 中的 id 参数
            const url = new URL(window.location.href);
            url.searchParams.delete('id');
            window.history.replaceState({}, '', url.toString());
            // 滚动到顶部
            window.scrollTo(0, 0);
            loadBonusList();
        }

        /**
         * 确认签收奖金
         */
        function confirmBonus() {
            if (!currentBonusId) return;
            weui.confirm('确认后表示您已收到并核实该笔奖金，确定要确认签收吗？', async function() {
                try {
                    const resp = await fetch('/api/bonus/confirm', {
                        method: 'POST',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({id: currentBonusId})
                    });
                    const data = await resp.json();
                    if (data.success) {
                        weui.toast('✅ 确认成功', 1500);
                        setTimeout(function() { openDetail(currentBonusId); }, 1500);
                    } else if (data.need_password) {
                        // 需要密码时回到列表视图
                        document.getElementById('detailView').style.display = 'none';
                        document.getElementById('listView').style.display = 'block';
                        showPasswordOverlay('确认奖金需要验证密码');
                    } else {
                        weui.topTips(data.error || '操作失败');
                    }
                } catch (e) {
                    weui.topTips('网络错误');
                }
            }, function() {}, {title: '确认签收'});
        }

        /**
         * 提交反馈：跳转到反馈页，带上当前奖金 ID
         */
        function submitFeedback() {
            if (!currentBonusId) return;
            var url = '/employee/feedback?bonus_id=' + currentBonusId;
            if (currentBonusInfo && currentBonusInfo.year) {
                url += '&bonus_year=' + encodeURIComponent(currentBonusInfo.year)
                    + '&bonus_type=' + encodeURIComponent(currentBonusInfo.bonus_type || '');
            }
            window.location.href = url;
        }

        // ===== 密码验证 =====
        function showPasswordOverlay(tip) {
            document.getElementById('passwordOverlay').style.display = 'flex';
            document.getElementById('pwSubtitle').textContent = tip || '查看奖金信息需要验证密码';
            document.getElementById('passwordInput').value = '';
            setTimeout(function() { document.getElementById('passwordInput').focus(); }, 300);
        }

        async function verifyPassword() {
            const pw = document.getElementById('passwordInput').value;
            if (!pw) { weui.topTips('请输入密码'); return; }
            try {
                const resp = await fetch('/api/auth/password/verify', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({password: pw})
                });
                const data = await resp.json();
                if (data.success) {
                    weui.toast('验证成功', 800);
                    setTimeout(function() {
                        document.getElementById('passwordOverlay').style.display = 'none';
                        // 如果是从详情页触发的密码验证，重新打开详情；否则刷新列表
                        if (currentBonusId) {
                            openDetail(currentBonusId);
                        } else {
                            loadBonusList();
                        }
                    }, 800);
                } else if (data.need_setup) {
                    window.location.href = '/employee/password';
                } else {
                    weui.topTips(data.error || '密码错误');
                }
            } catch (e) {
                weui.topTips('网络错误');
            }
        }

        // ===== 金额显示/隐藏切换 =====
        // 列表页：切换年份合计和卡片金额的模糊状态，并同步所有卡片眼睛图标
        function toggleAmount() {
            _state.amountShow = !_state.amountShow;
            const icon = _state.amountShow ? '👁' : '🙈';
            // 同步所有卡片上的眼睛图标
            document.querySelectorAll('[data-card-eye="1"]').forEach(function(el) {
                el.textContent = icon;
            });
            document.querySelectorAll('#bonusList .y-total, #bonusList .bc-amount').forEach(function(el) {
                if (_state.amountShow) el.classList.remove('blur-amount');
                else el.classList.add('blur-amount');
            });
        }

        function fitAmountFont(el) {
            if (!el) return;
            const len = el.textContent.trim().length;
            if (len <= 8) el.style.fontSize = '36px';
            else if (len <= 12) el.style.fontSize = '30px';
            else if (len <= 15) el.style.fontSize = '24px';
            else el.style.fontSize = '20px';
        }
        // 详情页：切换实发奖金和明细项金额的模糊状态
        function toggleDetailAmount() {
            _state.detailShow = !_state.detailShow;
            const eye = document.getElementById('detailEye');
            if (eye) eye.textContent = _state.detailShow ? '👁' : '🙈';
            const amt = document.getElementById('detailAmount');
            if (amt) {
                if (_state.detailShow) amt.classList.remove('blur-amount');
                else amt.classList.add('blur-amount');
            }
            document.querySelectorAll('#detailItems .item-value').forEach(function(el) {
                if (_state.detailShow) el.classList.remove('blur-amount');
                else el.classList.add('blur-amount');
            });
        }

        // ===== 工具函数 =====
        // XSS 防护：转义 HTML 特殊字符
        function esc(s) {
            var d = document.createElement('div');
            d.textContent = s == null ? '' : String(s);
            return d.innerHTML;
        }

        // 解析数值（容错：去除非数字字符）
        function parseNum(val) {
            var s = String(val || '').replace(/[^\d.\-]/g, '');
            var n = parseFloat(s);
            return isNaN(n) ? 0 : n;
        }

        // 格式化金额：千分位 + 两位小数
        function fmtNum(val) {
            var n = parseNum(val);
            var parts = n.toFixed(2).split('.');
            parts[0] = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, ',');
            return parts.join('.');
        }

        // 密码显示切换
        document.getElementById('eyeBtn').addEventListener('click', function() {
            const input = document.getElementById('passwordInput');
            if (input.type === 'password') {
                input.type = 'text';
                this.textContent = '🙈';
            } else {
                input.type = 'password';
                this.textContent = '👁';
            }
        });

        document.getElementById('pwConfirmBtn').addEventListener('click', verifyPassword);
        document.getElementById('passwordInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') verifyPassword();
        });
    </script>
</body>
</html>
