<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=0">
    <title>工资趋势</title>
    <link rel="stylesheet" href="/assets/weui.min.css?v=20260807a">
    <script src="/assets/weui.min.js?v=20260807a"></script>
    <script src="/assets/echarts.min.js?v=20260712b"></script>
    <script src="/assets/money.js?v=20260807a"></script>
    <style>
        :root { --theme: <?php echo htmlspecialchars($GLOBALS['_site_theme'], ENT_QUOTES, 'UTF-8'); ?>; }
        body { background: #f5f5f5; }
        .page { padding: 15px; }
        .ann-bar {
            background: #fff8e1;
            border-left: 3px solid #ffa726;
            padding: 10px 44px 10px 14px;
            font-size: 13px;
            color: #666;
            border-radius: 8px;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 6px;
            position: relative;
        }
        .ann-bar .gear-btn {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 26px;
            height: 26px;
            background: rgba(255,167,38,0.15);
            border-radius: 50%;
            cursor: pointer;
            font-size: 13px;
            color: #e67e22;
            text-decoration: none;
            transition: all 0.15s;
        }
        .ann-bar .gear-btn:active { background: rgba(255,167,38,0.3); }
        .card {
            background: #fff;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 15px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        }
        .chart-container { width: 100%; height: clamp(180px, 55vw, 300px); }
        .summary-item {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid #f5f5f5;
        }
        .summary-item .label { color: #666; }
        .summary-item .value { font-weight: bold; color: var(--theme); font-size: 18px; }
        .year-selector { text-align: center; padding: 10px 0; }
        .year-selector select {
            font-size: 16px; padding: 5px 15px;
            border: 1px solid #ddd; border-radius: 6px;
        }
        .loading { text-align: center; padding: 40px; color: #999; }
    </style>
</head>
<body>
    <div class="page">
        <div class="ann-bar">
            <?php if ($GLOBALS['_site_announcement']): ?>📢 <?php echo htmlspecialchars($GLOBALS['_site_announcement']); ?><?php endif; ?>
            <a href="/employee/password" class="gear-btn" title="密码设置">⚙️</a>
        </div>
        <div class="year-selector">
            <select id="yearSelector" onchange="loadChart()"></select>
        </div>

        <div class="card" id="summaryCard">
            <div style="font-size:16px;font-weight:bold;margin-bottom:15px;">📊 年度汇总</div>
            <div class="summary-item">
                <span class="label">本年总收入</span>
                <span class="value" id="totalIncome">0.00</span>
            </div>
            <div class="summary-item">
                <span class="label">月平均工资</span>
                <span class="value" id="avgSalary">0.00</span>
            </div>
            <div class="summary-item">
                <span class="label">年度奖金合计</span>
                <span class="value" id="bonusTotal" style="color:#ffa726;">0.00</span>
            </div>
            <div class="summary-item" style="border-bottom:none;">
                <span class="label">发放月数</span>
                <span class="value" id="monthCount" style="color:#333;">0</span>
            </div>
        </div>

        <div class="card">
            <div style="font-size:16px;font-weight:bold;margin-bottom:15px;">📈 月度工资趋势</div>
            <div class="chart-container" id="salaryChart"></div>
        </div>
    </div>

    <script>
        let myChart = null;
        var _chartResizeHandler = null;

        document.addEventListener('DOMContentLoaded', async function() {
            // 检查登录
            const resp = await fetch('/api/auth/me');
            if (resp.status === 401) {
                const redirect = encodeURIComponent(window.location.pathname);
                window.location.href = '/api/auth/login?redirect=' + redirect;
                return;
            }

            // 生成年份选择
            const now = new Date();
            const currentYear = now.getFullYear();
            const selector = document.getElementById('yearSelector');
            for (let y = currentYear; y >= currentYear - 4; y--) {
                const opt = document.createElement('option');
                opt.value = y;
                opt.textContent = y + '年';
                selector.appendChild(opt);
            }

            loadChart();
        });

        async function loadChart() {
            const year = document.getElementById('yearSelector').value;
            try {
                const resp = await fetch('/api/salary/chart/' + year);
                if (resp.status === 401) {
                    const redirect = encodeURIComponent('/employee/chart');
                    window.location.href = '/api/auth/login?redirect=' + redirect;
                    return;
                }
                if (!resp.ok) {
                    weui.topTips('加载失败 (HTTP ' + resp.status + ')');
                    return;
                }
                const data = await resp.json();
                if (data.success === false && data.error) {
                    weui.topTips(data.error);
                    return;
                }
                // 未设置密码 -> 引导设置
                if (data.need_password && data.need_setup) {
                    window.location.href = '/employee/password';
                    return;
                }
                // 需要验证密码 -> 跳详情页
                if (data.need_password) {
                    window.location.href = '/employee/detail';
                    return;
                }

                document.getElementById('totalIncome').innerHTML = fmtMoney(data.total);
                document.getElementById('avgSalary').innerHTML = fmtMoney(data.average);
                document.getElementById('bonusTotal').innerHTML = fmtMoney(data.bonus_total || 0);
                document.getElementById('monthCount').textContent = data.salaries.length + '个月';

                // 渲染图表
                if (myChart) myChart.dispose();
                myChart = echarts.init(document.getElementById('salaryChart'));

                const vw = window.innerWidth;
                const baseFont = Math.max(10, Math.min(12, vw / 36));
                const yFont = Math.max(9, Math.min(11, vw / 38));

                const option = {
                    tooltip: {
                        trigger: 'axis',
                        formatter: function(params) {
                            let html = params[0].axisValue;
                            params.forEach(p => {
                                if (p.seriesName === '奖金') {
                                    const val = parseFloat(p.value);
                                    html += '<br/>奖金合计：' + (val > 0 ? '¥' + val.toFixed(2) : '暂无奖金');
                                } else if (p.seriesName === '实发工资') {
                                    html += '<br/>' + p.seriesName + ': ¥' + parseFloat(p.value).toFixed(2);
                                }
                            });
                            return html;
                        }
                    },
                    grid: {
                        left: '3%', right: '3%', bottom: '4%', top: '8%',
                        containLabel: true
                    },
                    xAxis: {
                        type: 'category',
                        data: data.months.concat(['奖金']),
                        axisLabel: { fontSize: baseFont, interval: 0 }
                    },
                    yAxis: {
                        type: 'value',
                        axisLabel: {
                            fontSize: yFont,
                            formatter: v => v >= 10000 ? (v/10000).toFixed(1) + 'w' : v
                        }
                    },
                    series: [{
                        name: '实发工资',
                        type: 'bar',
                        data: data.salaries,
                        barWidth: vw < 340 ? '35%' : '45%',
                        itemStyle: {
                            color: getComputedStyle(document.documentElement).getPropertyValue('--theme').trim() || '#07c160',
                            borderRadius: [4, 4, 0, 0]
                        },
                        label: {
                            show: vw >= 360,
                            position: 'top',
                            fontSize: Math.max(9, Math.min(11, vw / 40)),
                            formatter: '¥{c}'
                        }
                    }, {
                        name: '奖金',
                        type: 'bar',
                        data: data.salaries.map(() => null).concat([data.bonus_total || 0]),
                        barWidth: vw < 340 ? '25%' : '30%',
                        itemStyle: {
                            color: '#ffa726',
                            borderRadius: [4, 4, 0, 0]
                        },
                        label: {
                            show: vw >= 360 && (data.bonus_total || 0) > 0,
                            position: 'top',
                            fontSize: Math.max(9, Math.min(11, vw / 40)),
                            formatter: '¥{c}'
                        }
                    }],
                    // 平均工资线
                    visualMap: {
                        show: false,
                        seriesIndex: 0,
                        min: 0,
                        max: Math.max(...data.salaries, 1),
                        color: [getComputedStyle(document.documentElement).getPropertyValue('--theme').trim() || '#07c160']
                    }
                };

                // 添加平均线
                if (data.average > 0) {
                    option.series.push({
                        name: '月平均',
                        type: 'line',
                        data: data.salaries.map(() => data.average),
                        lineStyle: {
                            type: 'dashed',
                            color: '#e64340'
                        },
                        symbol: 'none',
                        label: {
                            show: false
                        }
                    });
                }

                myChart.setOption(option);
                // 提取为命名函数，避免每次 loadChart 累积 resize 监听器
                if (_chartResizeHandler) {
                    window.removeEventListener('resize', _chartResizeHandler);
                }
                _chartResizeHandler = function() {
                    if (!myChart) return;
                    myChart.resize();
                    const vw2 = window.innerWidth;
                    const newBaseFont = Math.max(10, Math.min(12, vw2 / 36));
                    const newYFont = Math.max(9, Math.min(11, vw2 / 38));
                    myChart.setOption({
                        xAxis: { axisLabel: { fontSize: newBaseFont } },
                        yAxis: { axisLabel: { fontSize: newYFont } },
                        series: [{
                            barWidth: vw2 < 340 ? '35%' : '45%',
                            label: { show: vw2 >= 360, fontSize: Math.max(9, Math.min(11, vw2 / 40)) }
                        }, {
                            barWidth: vw2 < 340 ? '25%' : '30%',
                            label: { show: vw2 >= 360 && (data.bonus_total || 0) > 0, fontSize: Math.max(9, Math.min(11, vw2 / 40)) }
                        }]
                    });
                };
                window.addEventListener('resize', _chartResizeHandler);
            } catch (e) {
                weui.topTips('加载图表数据失败');
            }
        }
    </script>
</body>
</html>
