<body>
    <div class="login-wrap">

        <div class="login-card">
        <div class="field-label">密码</div>
        <div class="pwd-eye-wrap">
            <input type="password" id="passwordInput" class="password-input" placeholder="请输入密码" autocomplete="off">
            <span class="pwd-eye" id="eyeBtn">👁</span>
        </div>
        <button class="login-btn" id="loginBtn" onclick="handleLogin()">登录</button>
        <div class="setup-link" id="setupLink" style="display:none;">
            首次使用？<a href="javascript:;" onclick="goSetup()">设置密码</a>
        </div>

    </div>
    <script>
        const params = new URLSearchParams(window.location.search);
        const redirect = params.get('redirect') || '/employee/salary';
        let needSetup = false;
        document.getElementById('eyeBtn').addEventListener('click', function() {
            const input = document.getElementById('passwordInput');
            if (input.type === 'password') {
                input.type = 'text';
                this.textContent = '🙈';
            } else {
                input.type = 'password';
                this.textContent = '👁';
            }
        });
        document.getElementById('passwordInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') handleLogin();
        });
        async function handleLogin() {
            const pw = document.getElementById('passwordInput').value;
            if (!pw) {
                weui.topTips('请输入密码');
                return;
            }
            const btn = document.getElementById('loginBtn');
            btn.disabled = true;
            btn.textContent = '登录中...';
            try {
                const resp = await fetch('/api/auth/password/verify', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({password: pw})
                });
                const data = await resp.json();
                if (data.success) {
                    weui.toast('登录成功', 1000);
                    setTimeout(() => {
                        window.location.href = redirect;
                    }, 1000);
                } else if (data.need_setup) {
                    needSetup = true;
                    document.getElementById('setupLink').style.display = 'block';
                    weui.topTips('请先设置密码');
                } else {
                    weui.topTips(data.error || '密码错误');
                }
            } catch (e) {
                weui.topTips('网络错误，请重试');
            } finally {
                btn.disabled = false;
                btn.textContent = '登录';
            }
        }
        function goSetup() {
            window.location.href = '/employee/password?redirect=' + encodeURIComponent(redirect);
        }
        // 自动聚焦
        document.getElementById('passwordInput').focus();
    </script>
