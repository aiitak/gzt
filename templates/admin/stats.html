<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=0">
    <title>签收统计</title>
<link rel="stylesheet" href="/assets/weui.min.css?v=20260807a">
<link rel="stylesheet" href="/assets/admin.css?v=20260807a">
<script src="/assets/weui.min.js?v=20260807a"></script>
<script src="/assets/admin.js?v=20260807a"></script>
<script src="/assets/pinyin.js?v=20260807a"></script>
    <style>
        body { background: #f5f5f5; }
        .topbar { display:flex; justify-content:flex-end; margin-bottom:12px; }
        .btn-back { display:inline-flex; align-items:center; gap:4px; background:#07c160; color:#fff; text-decoration:none; padding:8px 16px; border-radius:8px; font-size:14px; box-shadow:0 2px 6px rgba(7,193,96,.25); }
        .btn-back:hover { background:#06ad56; }
        .page { max-width: 1000px; margin: 0 auto; padding: 15px; }
        .card {
            background: #fff;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 15px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        }
        .card-title {
            font-size: 16px; font-weight: bold;
            margin-bottom: 15px; padding-bottom: 10px;
            border-bottom: 2px solid #07c160;
        }
        .month-selector { margin-bottom: 15px; }
        .month-selector select {
            font-size: 16px; padding: 8px 15px;
            border: 1px solid #ddd; border-radius: 6px;
        }
        .summary-stats {
            display: flex; gap: 15px; flex-wrap: wrap;
            margin-bottom: 15px;
        }
        .summary-item {
            flex: 1; min-width: 100px;
            padding: 15px; border-radius: 8px;
            text-align: center;
        }
        .summary-item .num { font-size: 28px; font-weight: bold; }
        .summary-item .lbl { font-size: 12px; color: #999; margin-top: 4px; }
        .summary-item.green { background: #e8f8e8; }
        .summary-item.green .num { color: #07c160; }
        .summary-item.orange { background: #fff3e0; }
        .summary-item.orange .num { color: #ff9800; }
        .summary-item.blue { background: #e8f0fe; }
        .summary-item.blue .num { color: #576b95; }
        .dept-table { width: 100%; font-size: 13px; }
        .dept-table th, .dept-table td {
            padding: 8px 10px;
            border-bottom: 1px solid #f0f0f0;
            text-align: left;
        }
        .dept-table th { color: #999; font-weight: normal; }
        .progress-bar {
            height: 6px; border-radius: 3px;
            background: #f0f0f0; overflow: hidden;
        }
        .progress-bar .fill {
            height: 100%; border-radius: 3px;
            background: #07c160; transition: width 0.3s;
        }
        /* 部门统计增强 */
        .dept-toolbar{display:flex;gap:8px;margin-bottom:10px;align-items:center;flex-wrap:wrap;}
        .dept-search{flex:1;min-width:160px;padding:7px 12px;border:1px solid #ddd;border-radius:18px;font-size:13px;outline:none;}
        .dept-search:focus{border-color:#07c160;}
        .dept-sort{padding:6px 10px;border:1px solid #ddd;border-radius:14px;font-size:12px;background:#fff;cursor:pointer;color:#666;}
        .dept-sort:hover{background:#f0f8f4;}
        .dept-sort.active{background:#07c160;color:#fff;border-color:#07c160;}
        .dept-row.low .progress-bar .fill{background:#ff9800;}
        .dept-row.zero .progress-bar .fill{background:#fa5151;}
        .dept-more{text-align:center;padding:8px;background:#fafafa;border-radius:6px;font-size:12px;color:#576b95;cursor:pointer;margin-top:6px;}
        .dept-more:hover{background:#f0f8f4;}
        .unconfirmed-list { font-size: 13px; }
        .unconfirmed-list .item {
            padding: 6px 0; border-bottom: 1px solid #f5f5f5;
        }
        /* 待确认名单增强 */
        .uf-toolbar{display:flex;gap:8px;margin-bottom:10px;align-items:center;flex-wrap:wrap;}
        .uf-search{flex:1;min-width:180px;padding:7px 12px;border:1px solid #ddd;border-radius:18px;font-size:13px;outline:none;}
        .uf-search:focus{border-color:#07c160;}
        .uf-count{font-size:12px;color:#999;}
        .uf-dept-tags{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px;}
        .uf-dept-tag{padding:4px 10px;border-radius:12px;background:#f5f5f5;color:#666;font-size:12px;cursor:pointer;user-select:none;}
        .uf-dept-tag:hover{background:#e8f8e8;color:#07c160;}
        .uf-dept-tag.active{background:#07c160;color:#fff;}
        .uf-group{margin-bottom:10px;}
        .uf-group-title{font-size:12px;color:#576b95;font-weight:600;margin:6px 2px;display:flex;justify-content:space-between;align-items:center;}
        .uf-group-title .toggle{font-size:11px;color:#999;cursor:pointer;font-weight:400;}
        .uf-chips{display:flex;flex-wrap:wrap;gap:6px;}
        .uf-chip{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;background:#fff5f5;color:#fa5151;border:1px solid #ffd6d6;border-radius:12px;font-size:12px;}
        .uf-empty{text-align:center;color:#bbb;padding:20px;font-size:13px;}
        .uf-show-more{text-align:center;padding:8px;margin-top:6px;background:#fafafa;border-radius:6px;font-size:12px;color:#576b95;cursor:pointer;}
        .uf-show-more:hover{background:#f0f8f4;}
    </style>
</head>
<body>
    <header class="ad-appbar">
        <a class="ad-appbar__back" href="/admin/dashboard" aria-label="返回">‹</a>
        <div class="ad-appbar__title"><span class="ic">📊</span><span>签收统计</span></div>
        <div class="ad-appbar__actions">
            <a class="ad-appbar__btn" href="javascript:doLogout()">退出</a>
        </div>
    </header>
    <div class="page">
        <div class="card">
            <div class="card-title">📊 签收统计</div>

            <div class="month-selector">
                <select id="monthSelector" onchange="loadStats()"></select>
            </div>

            <div class="summary-stats" id="summaryStats">
                <div class="summary-item blue"><div class="num">-</div><div class="lbl">总人数</div></div>
                <div class="summary-item green"><div class="num">-</div><div class="lbl">已确认</div></div>
                <div class="summary-item orange"><div class="num">-</div><div class="lbl">待确认</div></div>
                <div class="summary-item blue"><div class="num">-%</div><div class="lbl">确认率</div></div>
            </div>

            <div id="deptStats"></div>
            <div id="deptToolbar" style="display:none;" class="dept-toolbar">
                <input class="dept-search" id="deptSearch" placeholder="🔍 搜索部门" oninput="renderDept()">
                <span class="dept-sort active" onclick="setDeptSort('rate', this)">按确认率</span>
                <span class="dept-sort" onclick="setDeptSort('count', this)">按人数</span>
            </div>
            <div id="deptBody"></div>
        </div>

        <div class="card" id="ufCard" style="display:none;">
            <div class="card-title">⏳ 待确认名单 <span id="ufTotal" style="font-size:13px;color:#999;font-weight:400;"></span></div>
            <div class="uf-toolbar">
                <input class="uf-search" id="ufSearch" placeholder="🔍 搜索姓名/拼音" oninput="renderUF()">
                <span class="uf-count" id="ufCount"></span>
            </div>
            <div class="uf-dept-tags" id="ufDeptTags"></div>
            <div id="ufBody"></div>
        </div>
    </div>

    <script>
        function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
        document.addEventListener('DOMContentLoaded', async function() {
            const resp = await fetch('/api/auth/me');
            if (resp.status === 401) {
                window.location.href = '/api/auth/login?redirect=/admin/stats';
                return;
            }
            loadMonthList();
        });

        async function loadMonthList() {
            try {
                const resp = await fetch('/api/admin/salary/list');
                const data = await resp.json();
                const selector = document.getElementById('monthSelector');
                selector.innerHTML = '';

                if (data.success && data.months && data.months.length > 0) {
                    const params = new URLSearchParams(window.location.search);
                    const ymParam = params.get('ym');
                    data.months.forEach(function(m) {
                        const ym = m.year + String(m.month).padStart(2, '0');
                        const opt = document.createElement('option');
                        opt.value = ym;
                        opt.textContent = m.year + '年' + m.month + '月';
                        selector.appendChild(opt);
                    });
                    // 优先选择 URL 参数指定的月份，否则选最近月份（第一个）
                    selector.value = ymParam && Array.from(selector.options).some(o => o.value === ymParam)
                        ? ymParam : selector.options[0].value;
                    loadStats();
                } else {
                    selector.innerHTML = '<option>暂无数据</option>';
                }
            } catch (e) {
                document.getElementById('monthSelector').innerHTML = '<option>加载失败</option>';
            }
        }

        async function loadStats() {
            const ym = document.getElementById('monthSelector').value;
            if (!ym || ym === '暂无数据') return;

            try {
                const resp = await fetch('/api/admin/stats/salary/' + ym);
                const data = await resp.json();

                // 汇总
                document.querySelectorAll('.summary-item .num')[0].textContent = data.total || 0;
                document.querySelectorAll('.summary-item .num')[1].textContent = data.confirmed || 0;
                document.querySelectorAll('.summary-item .num')[2].textContent = data.unconfirmed || 0;
                document.querySelectorAll('.summary-item .num')[3].textContent = (data.rate || 0) + '%';

                // 部门统计
                renderDeptStats(data.dept_stats || {});

                // 未确认名单
                renderUnconfirmed(data.unconfirmed_list || []);
            } catch (e) {
                weui.topTips('加载统计失败');
            }
        }

        // ===== 部门统计：搜索 + 排序 + 折叠 =====
        var DEPT_DATA = {};        // {deptName: {total, confirmed}}
        var DEPT_SORT = 'rate';    // 'rate' | 'count'
        var DEPT_LIMIT = 8;        // 默认显示数量
        var DEPT_SHOW_ALL = false;

        function renderDeptStats(stats){
            DEPT_DATA = stats;
            DEPT_SHOW_ALL = false;
            var keys = Object.keys(stats || {});
            var toolbar = document.getElementById('deptToolbar');
            var oldContainer = document.getElementById('deptStats');
            oldContainer.innerHTML = '';
            if(keys.length === 0){
                toolbar.style.display = 'none';
                document.getElementById('deptBody').innerHTML = '<div style="color:#999;text-align:center;padding:10px;">暂无部门数据</div>';
                return;
            }
            toolbar.style.display = 'flex';
            document.getElementById('deptSearch').value = '';
            renderDept();
        }

        function setDeptSort(s, el){
            DEPT_SORT = s;
            document.querySelectorAll('.dept-sort').forEach(function(b){ b.classList.remove('active'); });
            el.classList.add('active');
            renderDept();
        }

        function renderDept(){
            var q = (document.getElementById('deptSearch').value || '').trim().toLowerCase();
            var arr = [];
            for(var d in DEPT_DATA){
                if(q){
                    if(d.toLowerCase().indexOf(q)>=0) {} 
                    else if(typeof matchPinyinQuery==='function' && matchPinyinQuery(q, d)) {}
                    else continue;
                }
                var s = DEPT_DATA[d];
                var rate = s.total > 0 ? (s.confirmed / s.total * 100) : 0;
                arr.push({name:d, total:s.total, confirmed:s.confirmed, rate:rate});
            }
            // 排序
            arr.sort(function(a,b){
                if(DEPT_SORT === 'rate') return a.rate - b.rate;  // 确认率低在前（需关注）
                return b.total - a.total;                         // 人数多在前
            });
            if(arr.length === 0){
                document.getElementById('deptBody').innerHTML = '<div style="color:#999;text-align:center;padding:10px;">无匹配部门</div>';
                return;
            }
            var shown = DEPT_SHOW_ALL ? arr : arr.slice(0, DEPT_LIMIT);
            var html = '<table class="dept-table"><tr><th>部门</th><th>总人数</th><th>已确认</th><th>确认率</th></tr>';
            shown.forEach(function(it){
                var rateStr = it.rate.toFixed(1);
                var cls = it.rate === 0 ? 'zero' : (it.rate < 50 ? 'low' : '');
                html += '<tr class="dept-row '+cls+'">'
                    + '<td>'+esc(it.name)+'</td>'
                    + '<td>'+it.total+'</td>'
                    + '<td>'+it.confirmed+'</td>'
                    + '<td>'
                    +   '<div class="progress-bar"><div class="fill" style="width:'+rateStr+'%"></div></div>'
                    +   '<div style="font-size:11px;color:#999;margin-top:2px;">'+rateStr+'%</div>'
                    + '</td>'
                    + '</tr>';
            });
            html += '</table>';
            if(arr.length > DEPT_LIMIT && !DEPT_SHOW_ALL){
                html += '<div class="dept-more" onclick="showAllDept()">展开剩余 '+(arr.length-DEPT_LIMIT)+' 个部门 ▾</div>';
            } else if(DEPT_SHOW_ALL && arr.length > DEPT_LIMIT){
                html += '<div class="dept-more" onclick="collapseDept()">收起 ▴</div>';
            }
            document.getElementById('deptBody').innerHTML = html;
        }

        function showAllDept(){ DEPT_SHOW_ALL = true; renderDept(); }
        function collapseDept(){ DEPT_SHOW_ALL = false; renderDept(); }

        // ===== 待确认名单：搜索 + 部门分组 + 折叠 =====
        var UF_DATA = [];          // 所有待确认员工
        var UF_DEPT_FILTER = 'all'; // 当前部门筛选
        var UF_COLLAPSED = {};      // 各部门折叠状态 {deptName: true/false}
        var UF_LIMIT = 10;          // 每组默认显示数量

        function renderUnconfirmed(list){
            UF_DATA = list;
            UF_DEPT_FILTER = 'all';
            UF_COLLAPSED = {};
            UF_EXPANDED = {};
            var card = document.getElementById('ufCard');
            if(list.length === 0){
                card.style.display = 'block';
                document.getElementById('ufTotal').textContent = '';
                document.getElementById('ufDeptTags').innerHTML = '';
                document.getElementById('ufBody').innerHTML = '<div class="uf-empty">🎉 全部已确认</div>';
                document.querySelector('.uf-toolbar').style.display = 'none';
                return;
            }
            card.style.display = 'block';
            document.querySelector('.uf-toolbar').style.display = 'flex';
            document.getElementById('ufTotal').textContent = '（共 ' + list.length + ' 人）';
            document.getElementById('ufSearch').value = '';
            // 渲染部门标签
            var depts = {};
            list.forEach(function(u){ depts[u.department || '未分配'] = (depts[u.department || '未分配']||0)+1; });
            var tagHtml = '<span class="uf-dept-tag active" onclick="setUFDept(\'all\')">全部 '+list.length+'</span>';
            Object.keys(depts).sort().forEach(function(d){
                tagHtml += '<span class="uf-dept-tag" onclick="setUFDept(\''+esc(d)+'\')">'+esc(d)+' '+depts[d]+'</span>';
            });
            document.getElementById('ufDeptTags').innerHTML = tagHtml;
            renderUF();
        }

        function setUFDept(d){
            UF_DEPT_FILTER = d;
            var tags = document.querySelectorAll('.uf-dept-tag');
            tags.forEach(function(t){
                var m = t.textContent.match(/^(.+?)\s*\d+$/);
                var name = m ? m[1] : '全部';
                t.classList.toggle('active', (d==='all' && name==='全部') || name===d);
            });
            renderUF();
        }

        function renderUF(){
            var q = (document.getElementById('ufSearch').value || '').trim().toLowerCase();
            // 过滤
            var filtered = UF_DATA.filter(function(u){
                var dept = u.department || '未分配';
                var passDept = UF_DEPT_FILTER === 'all' || dept === UF_DEPT_FILTER;
                var passQ = !q || (u.name||'').toLowerCase().indexOf(q) >= 0 || (typeof matchPinyinQuery==='function' && matchPinyinQuery(q, u.name||''));
                return passDept && passQ;
            });
            document.getElementById('ufCount').textContent = '显示 ' + filtered.length + ' / ' + UF_DATA.length + ' 人';
            if(filtered.length === 0){
                document.getElementById('ufBody').innerHTML = '<div class="uf-empty">无匹配人员</div>';
                return;
            }
            // 按部门分组
            var groups = {};
            filtered.forEach(function(u){
                var d = u.department || '未分配';
                if(!groups[d]) groups[d] = [];
                groups[d].push(u);
            });
            var html = '';
            Object.keys(groups).sort().forEach(function(dept){
                var people = groups[dept];
                var collapsed = UF_COLLAPSED[dept];
                var showCount = collapsed ? 0 : (UF_EXPANDED[dept] ? 9999 : UF_LIMIT);
                html += '<div class="uf-group">';
                html += '<div class="uf-group-title"><span>📁 '+esc(dept)+' ('+people.length+')</span>';
                html += '<span class="toggle" onclick="toggleUFGroup(\''+esc(dept)+'\')">'+(collapsed?'展开 ▾':'收起 ▴')+'</span></div>';
                if(!collapsed){
                    var shown = people.slice(0, showCount);
                    html += '<div class="uf-chips">';
                    shown.forEach(function(u){
                        html += '<span class="uf-chip">👤 '+esc(u.name)+'</span>';
                    });
                    html += '</div>';
                    if(people.length > showCount){
                        html += '<div class="uf-show-more" onclick="showAllUF(\''+esc(dept)+'\')">查看剩余 '+(people.length-showCount)+' 人 ▾</div>';
                    }
                }
                html += '</div>';
            });
            document.getElementById('ufBody').innerHTML = html;
        }

        function toggleUFGroup(dept){
            UF_COLLAPSED[dept] = !UF_COLLAPSED[dept];
            renderUF();
        }

        function showAllUF(dept){
            UF_EXPANDED[dept] = true;
            renderUF();
        }
    </script>
</body>
</html>
