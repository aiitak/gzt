    <?php if (!empty($login_error)): ?><script>window._LOGIN_ERROR = <?php echo json_encode((string)$login_error, JSON_UNESCAPED_UNICODE); ?>;</script><?php endif; ?>
    <form id="loginForm">
        <label>登录账号</label>
        <input name="admin_login" placeholder="管理员后台登录账号" required>
        <label>登录密码</label>
        <input name="password" type="password" placeholder="后台登录密码" required>
        <button class="btn" type="submit">登录后台</button>
    </form>
    <button class="wecom-btn" onclick="location.href='/api/auth/login?redirect=/admin/dashboard'">🟢 使用企业微信登录</button>
</div>
<script>
(function(){
    if (window._LOGIN_ERROR) {
        const err = document.getElementById('err');
        err.textContent = window._LOGIN_ERROR;
        err.style.display = 'block';
    }
})();
document.getElementById('loginForm').addEventListener('submit', async function(e){
    e.preventDefault();
    const err = document.getElementById('err');
    err.style.display = 'none';
    const fd = new FormData(this);
    const body = new URLSearchParams();
    body.append('admin_login', fd.get('admin_login'));
    body.append('password', fd.get('password'));
    const resp = await fetch('/api/admin/login', { method:'POST', body });
    const data = await resp.json().catch(()=>({}));
    if (data.success) {
        location.href = '/admin/dashboard';
    } else {
        err.textContent = data.error || '登录失败';
        err.style.display = 'block';
    }
});
</script>
    <script>
    (function(){
      function addEye(inp){
        if(inp.dataset.eyeReady) return;
        inp.dataset.eyeReady='1';
        var wrap=document.createElement('span');
        wrap.className='pwd-eye-wrap';
        inp.parentNode.insertBefore(wrap, inp);
        wrap.appendChild(inp);
        var eye=document.createElement('span');
        eye.className='pwd-eye';
        eye.setAttribute('role','button');
        eye.setAttribute('aria-label','显示或隐藏密码');
        eye.textContent='👁';
        wrap.appendChild(eye);
        eye.addEventListener('click', function(){
          if(inp.type==='password'){ inp.type='text'; eye.textContent='🙈'; }
          else { inp.type='password'; eye.textContent='👁'; }
        });
      }
      function init(){ document.querySelectorAll('input[type=password]').forEach(addEye); }
      if(document.readyState!=='loading') init();
      else document.addEventListener('DOMContentLoaded', init);
    })();
    </script>
</body>
