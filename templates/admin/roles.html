<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=0">
    <title>角色管理</title>
<link rel="stylesheet" href="/assets/weui.min.css?v=20260807a">
<link rel="stylesheet" href="/assets/admin.css?v=20260807a">
<script src="/assets/weui.min.js?v=20260807a"></script>
<script src="/assets/admin.js?v=20260807a"></script>
<script src="/assets/pinyin.js?v=20260807a"></script>
    <style>
        body { background: #f5f5f5; }
        .topbar { display:flex; justify-content:flex-end; margin-bottom:12px; }
        .btn-back { display:inline-flex; align-items:center; gap:4px; background:#07c160; color:#fff; text-decoration:none; padding:8px 16px; border-radius:8px; font-size:14px; box-shadow:0 2px 6px rgba(7,193,96,.25); }
        .btn-back:hover { background:#06ad56; }
        .page { max-width: 800px; margin: 0 auto; padding: 15px; }
        .card {
            background: #fff;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 15px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        }
        .card-title {
            font-size: 16px; font-weight: bold;
            margin-bottom: 15px; padding-bottom: 10px;
            border-bottom: 2px solid #07c160;
        }
        .role-section { margin-bottom: 20px; }
        .role-section .sub-title {
            font-size: 14px; font-weight: bold;
            color: #576b95; margin-bottom: 10px;
        }
        .user-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 0;
            border-bottom: 1px solid #f5f5f5;
        }
        .user-item:last-child { border-bottom: none; }
        .user-item .info { font-size: 14px; }
        .user-item .info .dept { font-size: 12px; color: #999; }
        .add-section {
            padding: 10px;
            background: #f8f8f8;
            border-radius: 6px;
            margin-top: 10px;
        }
        .add-section .weui-cell { padding: 8px 0; }
        .hr-assignment {
            padding: 8px 0;
            border-bottom: 1px solid #f5f5f5;
            font-size: 14px;
        }
        .hr-assignment:last-child { border-bottom: none; }
        .empty-tip { color: #999; font-size: 13px; text-align: center; padding: 20px; }
        .pick-btn { display:flex; align-items:center; justify-content:center; gap:6px; margin:10px 0 4px; background:#fff; color:#07c160; font-size:13px; padding:9px 14px; border-radius:8px; text-decoration:none; cursor:pointer; border:1px solid #07c160; box-sizing:border-box; }
        .pick-btn:active { background:#f0fff0; }
        .picked-name { display:inline-block; margin-left:8px; font-size:13px; color:#07c160; }
        /* 成员卡片 */
        .role-card { display:flex; align-items:center; gap:12px; padding:12px; background:#fafafa; border:1px solid #f0f0f0; border-radius:10px; margin-bottom:10px; }
        .role-card__avatar { width:40px; height:40px; border-radius:50%; background:#07c160; color:#fff; display:flex; align-items:center; justify-content:center; font-size:16px; font-weight:600; flex:0 0 auto; }
        .role-card__main { flex:1; min-width:0; }
        .role-card__name { font-size:15px; font-weight:500; }
        .role-card__uid { font-size:12px; color:#999; font-weight:400; margin-left:6px; }
        .role-card__badges { margin-top:7px; display:flex; flex-wrap:wrap; gap:6px; }
        .role-card__del { flex:0 0 auto; color:#fa5151; font-size:16px; text-decoration:none; padding:6px 10px; border-radius:6px; background:#fdecec; }
        .role-card__del:active { background:#fbd6d6; }
        /* 角色分组（角色在上，人员在下） */
        .role-group { margin-bottom:18px; background:#fff; border:1px solid #f0f0f0; border-radius:10px; overflow:hidden; }
        .role-group__head { display:flex; align-items:center; gap:10px; padding:12px 14px; background:#fafafa; border-bottom:1px solid #f0f0f0; }
        .role-group__desc { flex:1; min-width:0; font-size:12px; color:#999; }
        .role-group__count { flex:0 0 auto; font-size:12px; color:#576b95; background:#eef4ff; padding:2px 8px; border-radius:10px; }
        .role-group__body { padding:12px 14px; }
        .role-group__empty { color:#bbb; font-size:13px; text-align:center; padding:14px 0; }
        /* 人员标签（chips） */
        .member-chips { display:flex; flex-wrap:wrap; gap:8px; }
        .member-chip { display:inline-flex; align-items:center; gap:6px; background:#f5f7fa; border:1px solid #e7e9ed; color:#1f2329; font-size:13px; padding:6px 10px 6px 12px; border-radius:20px; cursor:pointer; transition:all 0.15s; }
        .member-chip:hover { background:#fdecec; border-color:#fcc8c8; color:#d33; }
        .member-chip:hover .member-chip__x { color:#fa5151; }
        .member-chip__name { font-weight:500; }
        .member-chip__x { color:#bbb; font-size:11px; font-weight:700; }
        .badge { display:inline-flex; align-items:center; gap:5px; font-size:12px; padding:3px 10px; border-radius:20px; cursor:pointer; user-select:none; }
        .badge .badge-x { font-size:10px; opacity:.7; }
        .badge .badge-x:hover { opacity:1; }
        .badge-admin { background:#fff3e0; color:#e08a00; border:1px solid #ffe0b2; }
        .badge-finance { background:#e8f8ee; color:#07c160; border:1px solid #c8efd6; }
        .badge-hr { background:#e7f1ff; color:#3a7afe; border:1px solid #c9ddff; }
        /* 已选成员 chips */
        .chips { display:flex; flex-wrap:wrap; gap:6px; margin-top:6px; }
        .chip { display:inline-flex; align-items:center; gap:6px; background:#eafaf0; color:#07c160; font-size:12px; padding:3px 9px; border-radius:20px; }
        .chip a { color:#07c160; text-decoration:none; font-weight:700; }
        /* 角色多选 */
        .role-chks { display:flex; gap:18px; padding:4px 0; }
        .role-chk { display:flex; align-items:center; gap:6px; font-size:14px; cursor:pointer; }
        .role-chk input { width:16px; height:16px; }
        /* 通讯录选择器弹窗 */
        .picker-mask { position:fixed; inset:0; background:rgba(0,0,0,.5); z-index:1000; display:flex; align-items:flex-end; justify-content:center; }
        @media(min-width:560px){ .picker-mask { align-items:center; } }
        .picker { background:#fff; width:100%; max-width:520px; max-height:82vh; display:flex; flex-direction:column; border-radius:14px 14px 0 0; overflow:hidden; }
        @media(min-width:560px){ .picker { border-radius:14px; } }
        .picker__head { display:flex; justify-content:space-between; align-items:center; padding:14px 16px; border-bottom:1px solid #f0f0f0; font-weight:600; }
        .picker__close { color:#999; font-size:18px; text-decoration:none; padding:0 4px; }
        .picker__search { margin:10px 12px; padding:9px 12px; border:1px solid #ddd; border-radius:8px; font-size:14px; box-sizing:border-box; }
        .picker__list { flex:1; overflow:auto; padding:0 12px; }
        .picker__item { display:flex; justify-content:space-between; align-items:center; padding:11px 6px; border-bottom:1px solid #f7f7f7; cursor:pointer; }
        .picker__item:active { background:#f2fbf6; }
        .picker__item .nm { font-size:14px; }
        .picker__item .uid { font-size:12px; color:#999; }
        .picker__tip { padding:10px 16px; font-size:12px; color:#999; border-top:1px solid #f0f0f0; line-height:1.5; }
        .picker__foot { display:flex; align-items:center; justify-content:space-between; gap:12px; padding:12px 16px; border-top:1px solid #f0f0f0; background:#fff; }
        .picker__selinfo { font-size:13px; color:#576b95; }
        .cb { font-size:18px; color:#bbb; width:26px; text-align:center; flex:0 0 auto; }
        .cb.on { color:#07c160; }
    </style>
</head>
<body>
    <header class="ad-appbar">
        <a class="ad-appbar__back" href="/admin/dashboard" aria-label="返回">‹</a>
        <div class="ad-appbar__title"><span class="ic">👑</span><span>角色管理</span></div>
        <div class="ad-appbar__actions">
            <a class="ad-appbar__btn" href="javascript:doLogout()">退出</a>
        </div>
    </header>
    <div class="page">
        <!-- 角色分配 -->
        <div class="card">
            <div class="card-title">👑 角色分配</div>
            <div style="font-size:13px;color:#999;margin-bottom:15px;">
                管理员：拥有全部权限 | 财务：上传和推送工资条 | 人事：回复员工反馈
            </div>

            <div id="roleList"></div>

            <div class="add-section">
                <div style="font-size:14px;font-weight:bold;margin-bottom:10px;">➕ 添加角色</div>
                <div class="weui-cells weui-cells_form" style="margin:0;">
                    <div class="weui-cell">
                        <div class="weui-cell__hd"><label class="weui-label">成员</label></div>
                        <div class="weui-cell__bd">
                            <input class="weui-input" id="newUserid" placeholder="UserID（可多个，逗号分隔）或点下方选择">
                            <div class="chips" id="pickedMembers"></div>
                        </div>
                    </div>
                </div>
                <a href="javascript:openPicker('user','选择成员（可多选）',function(items){ if(Array.isArray(items)) setPicked(items); }, true)" class="pick-btn">📇 从通讯录选择</a>
                <div class="weui-cells weui-cells_form" style="margin:8px 0 0;">
                    <div class="weui-cell">
                        <div class="weui-cell__hd"><label class="weui-label">角色</label></div>
                        <div class="weui-cell__bd">
                            <div class="role-chks">
                                <label class="role-chk"><input type="checkbox" id="roleAdmin" value="admin"> 👑 管理员</label>
                                <label class="role-chk"><input type="checkbox" id="roleFinance" value="finance"> 💰 财务</label>
                                <label class="role-chk"><input type="checkbox" id="roleHr" value="hr"> 👤 人事</label>
                            </div>
                        </div>
                    </div>
                </div>
                <a href="javascript:addRole()" class="weui-btn weui-btn_primary" style="margin-top:12px;display:block;width:100%;box-sizing:border-box;">➕ 添加角色</a>
            </div>
        </div>

        <!-- 反馈负责人分配 -->
        <div class="card">
            <div class="card-title">💬 反馈负责人分配</div>
            <div style="font-size:13px;color:#999;margin-bottom:15px;">
                设置员工或部门的反馈由哪位人事负责处理
            </div>

            <div id="hrAssignmentList"></div>

            <div class="add-section">
                <div style="font-size:14px;font-weight:bold;margin-bottom:10px;">➕ 添加分配</div>
                <div class="weui-cells weui-cells_form" style="margin:0;">
                    <div class="weui-cell">
                        <div class="weui-cell__hd"><label class="weui-label">类型</label></div>
                        <div class="weui-cell__bd">
                            <select id="assignType" class="weui-select" onchange="toggleAssignTarget()">
                                <option value="user">按员工</option>
                                <option value="dept">按部门</option>
                            </select>
                        </div>
                    </div>
                    <div class="weui-cell">
                        <div class="weui-cell__hd"><label class="weui-label">目标</label></div>
                        <div class="weui-cell__bd">
                            <input class="weui-input" id="assignTarget" placeholder="员工UserID 或 部门ID">
                            <span class="picked-name" id="assignTargetName"></span>
                        </div>
                    </div>
                </div>
                <a href="javascript:openPicker(document.getElementById('assignType').value==='user'?'user':'dept','选择目标（可多选）',function(items){ if(Array.isArray(items)){ document.getElementById('assignTarget').value=items.map(function(i){return i.id;}).join(','); document.getElementById('assignTargetName').textContent=items.map(function(i){return i.name;}).join('、'); } }, true)" class="pick-btn">📇 从通讯录选择目标</a>
                <div class="weui-cells weui-cells_form" style="margin:8px 0 0;">
                    <div class="weui-cell">
                        <div class="weui-cell__hd"><label class="weui-label">人事</label></div>
                        <div class="weui-cell__bd">
                            <input class="weui-input" id="hrUserid" placeholder="人事UserID（可多个，逗号分隔）或点下方选择">
                            <div class="chips" id="pickedHr"></div>
                        </div>
                    </div>
                </div>
                <a href="javascript:openHrPicker()" class="pick-btn">📇 从人事角色选择（可多选）</a>
                <a href="javascript:;" class="weui-btn weui-btn_primary" onclick="addAssignment()" style="margin-top:12px;display:block;width:100%;box-sizing:border-box;">➕ 添加分配</a>
            </div>
        </div>
    </div>

    <!-- 通讯录选择器弹窗 -->
    <div id="pickerMask" class="picker-mask" style="display:none;">
        <div class="picker">
            <div class="picker__head">
                <span id="pickerTitle">选择成员</span>
                <a href="javascript:closePicker()" class="picker__close">✕</a>
            </div>
            <input type="text" id="pickerSearch" class="picker__search" placeholder="搜索姓名 / 拼音首字母 / 全拼 / UserID / 部门" oninput="renderPicker()">
            <div id="pickerList" class="picker__list"></div>
            <div class="picker__tip" id="pickerTip"></div>
            <div class="picker__foot" id="pickerFoot" style="display:none;">
                <span class="picker__selinfo" id="pickerSelInfo">已选 0 项</span>
                <a href="javascript:confirmPicker()" class="weui-btn weui-btn_primary" style="margin:0;width:auto;padding:0 22px;">确定</a>
            </div>
        </div>
    </div>

    <script>
        var CONTACTS=null, pickerCtx=null;
        async function ensureContacts(){
            if(CONTACTS) return CONTACTS;
            try { const r=await fetch('/api/admin/contacts'); CONTACTS=await r.json(); } catch(e){ CONTACTS={users:[],departments:[],tags:[]}; }
            return CONTACTS;
        }
        function openPicker(kind,title,onPick,multiple){
            pickerCtx={kind:kind,onPick:onPick,multiple:!!multiple,selected:[]};
            document.getElementById('pickerTitle').textContent=title||'选择';
            document.getElementById('pickerSearch').value='';
            document.getElementById('pickerFoot').style.display=multiple?'flex':'none';
            renderPicker();
            document.getElementById('pickerMask').style.display='flex';
        }
        function closePicker(){ document.getElementById('pickerMask').style.display='none'; pickerCtx=null; }
        // 拉取拥有「人事」角色的成员列表（供反馈负责人分配时选择）
        // 用 null 表示「未加载」，空数组 [] 也能区分「已加载但无人事」
        var HR_USERS=null;
        async function ensureHrUsers(){
            if(HR_USERS !== null) return HR_USERS;
            try {
                const r=await fetch('/api/admin/hr_users');
                const d=await r.json();
                HR_USERS=(d && d.success) ? (d.data || []) : [];
            } catch(e){ HR_USERS=[]; }
            return HR_USERS;
        }
        // 打开「人事角色选择」弹窗（只能从拥有人事角色的成员中选）
        async function openHrPicker(){
            await ensureHrUsers();
            openPicker('hr','选择人事（仅显示人事角色成员，可多选）',function(items){ if(Array.isArray(items)) setPickedHr(items); }, true);
        }
        function _itemMatchesQuery(item, q){
            if(!q) return true;
            const name=(item.name||'').toLowerCase();
            const userid=(item.userid||'').toLowerCase();
            const sub=(item.sub||'').toLowerCase();
            if(name.indexOf(q)>=0||userid.indexOf(q)>=0||sub.indexOf(q)>=0) return true;
            if(typeof matchPinyinQuery==='function'){
                if(matchPinyinQuery(q, item.name||'')) return true;
            }
            return false;
        }
        function renderPicker(){
            const list=document.getElementById('pickerList'), tip=document.getElementById('pickerTip');
            const selInfo=document.getElementById('pickerSelInfo');
            const q=(document.getElementById('pickerSearch').value||'').trim();
            const kind=pickerCtx?pickerCtx.kind:'user';
            let items=[];
            if(kind==='hr'){
                (HR_USERS||[]).forEach(u=>{
                    if(_itemMatchesQuery({name:u.name,userid:u.userid,sub:'人事'},q))
                        items.push({id:u.userid,name:u.name,sub:'人事',type:'user'});
                });
            } else {
                if(!CONTACTS){ list.innerHTML='<div class="empty-tip">通讯录加载中…</div>'; return; }
                if(kind==='dept'||kind==='both'){
                    (CONTACTS.departments||[]).forEach(d=>{
                        if(_itemMatchesQuery({name:d.name,userid:String(d.dept_id),sub:'部门'},q))
                            items.push({id:d.dept_id,name:d.name,sub:'部门',type:'dept'});
                    });
                }
                if(kind==='user'||kind==='both'){
                    (CONTACTS.users||[]).forEach(u=>{
                        if(_itemMatchesQuery({name:u.name,userid:u.userid,sub:u.dept_name||''},q))
                            items.push({id:u.userid,name:u.name,sub:u.dept_name||('ID:'+u.userid),type:'user'});
                    });
                }
            }
            window.__pickerItems=items;
            const multi=pickerCtx.multiple;
            if(items.length===0){
                list.innerHTML='<div class="empty-tip">'+(kind==='hr'?'暂无人事角色成员，请先在上方「角色分配」中为成员分配人事角色':'无匹配结果')+'</div>';
            }
            else { list.innerHTML=items.map((it,idx)=>{
                const checked=multi&&pickerCtx.selected.indexOf(it.id)>=0;
                const right=multi
                    ? ('<span class="cb'+(checked?' on':'')+'">'+(checked?'●':'○')+'</span>')
                    : ('<span class="uid">'+esc(it.sub)+'</span>');
                return '<div class="picker__item" onclick="pickItem('+idx+')"><span class="nm">'+esc(it.name)+(it.type==='dept'?' <span class="uid">(部门)</span>':'')+'</span>'+right+'</div>';
            }).join(''); }
            if(multi){ selInfo.textContent='已选 '+pickerCtx.selected.length+' 项'; }
            if(kind==='hr'){
                tip.textContent=multi
                    ? ('仅可选择人事角色成员。可多选：点击条目勾选，完成后点「确定」'+((HR_USERS||[]).length?'':'（暂无人事角色成员，请先在上方「角色分配」为成员分配人事角色）'))
                    : '点击条目即可选中';
                return;
            }
            const hasData=!!CONTACTS && ((CONTACTS.users||[]).length>0 || (CONTACTS.departments||[]).length>0);
            tip.textContent=multi
                ? ('可多选：点击条目勾选，完成后点「确定」'+(hasData?'':'（暂无通讯录数据，请先同步）'))
                : (hasData?'点击条目即可选中（也可直接手填 UserID / 部门ID）':'暂无通讯录数据：请先在「通讯录」页点同步。若同步报 48009，请在企业微信后台把本服务器公网 IP 加入「可信 IP」白名单。');
        }
        function pickItem(idx){
            const it=window.__pickerItems[idx]; if(!it) return;
            if(pickerCtx.multiple){ const i=pickerCtx.selected.indexOf(it.id); if(i>=0)pickerCtx.selected.splice(i,1); else pickerCtx.selected.push(it.id); renderPicker(); return; }
            if(pickerCtx&&pickerCtx.onPick) pickerCtx.onPick(it); closePicker();
        }
        function confirmPicker(){
            if(!pickerCtx) return;
            const sel=pickerCtx.selected.map(function(id){ return window.__pickerItems.find(function(it){ return String(it.id)===String(id); }); }).filter(Boolean);
            if(pickerCtx.onPick) pickerCtx.onPick(sel);
            closePicker();
        }
        document.getElementById('pickerMask').addEventListener('click',function(e){ if(e.target===this) closePicker(); });

        document.addEventListener('DOMContentLoaded', async function() {
            const resp = await fetch('/api/auth/me');
            if (resp.status === 401) {
                window.location.href = '/api/auth/login?redirect=/admin/roles';
                return;
            }
            ensureContacts();
            loadRoles();
            loadAssignments();
        });

        function toggleAssignTarget() {
            const type = document.getElementById('assignType').value;
            document.getElementById('assignTarget').placeholder = type === 'user' ? '输入员工UserID' : '输入部门ID';
        }

        // ===== 角色管理 =====
        var pickedNameMap = {};
        function setPicked(items) {
            items.forEach(function (i) { pickedNameMap[i.id] = i.name; });
            document.getElementById('newUserid').value = Object.keys(pickedNameMap).join(',');
            renderPicked();
        }
        function removePicked(id) {
            delete pickedNameMap[id];
            document.getElementById('newUserid').value = Object.keys(pickedNameMap).join(',');
            renderPicked();
        }
        function renderPicked() {
            const ids = Object.keys(pickedNameMap);
            document.getElementById('pickedMembers').innerHTML = ids.length
                ? ids.map(function (id) {
                    return '<span class="chip">' + esc(pickedNameMap[id]) + ' <a href="javascript:removePicked(\'' + esc(id) + '\')">✕</a></span>';
                }).join('')
                : '';
        }
        const ROLE_META = {
            admin:   { ic: '👑', name: '管理员', cls: 'badge-admin', desc: '拥有全部权限' },
            finance: { ic: '💰', name: '财务',   cls: 'badge-finance', desc: '上传和推送工资条' },
            hr:      { ic: '👤', name: '人事',   cls: 'badge-hr', desc: '回复员工反馈' }
        };
        async function loadRoles() {
            try {
                const resp = await fetch('/api/admin/roles/list');
                const data = await resp.json();
                const container = document.getElementById('roleList');
                if (!Array.isArray(data) || data.length === 0) {
                    container.innerHTML = '<div class="empty-tip">暂无角色成员，请在下方添加</div>';
                    return;
                }
                // 按角色分组：角色在上，该角色的人员以标签形式平铺在下
                const groups = { admin: [], finance: [], hr: [] };
                data.forEach(function (u) {
                    (u.roles || []).forEach(function (r) {
                        if (groups[r]) groups[r].push(u);
                    });
                });
                let html = '';
                ['admin', 'finance', 'hr'].forEach(function (r) {
                    const m = ROLE_META[r];
                    const members = groups[r] || [];
                    html += '<div class="role-group">'
                        +  '<div class="role-group__head">'
                        +    '<span class="badge ' + m.cls + '">' + m.ic + ' ' + m.name + '</span>'
                        +    '<span class="role-group__desc">' + esc(m.desc) + '</span>'
                        +    '<span class="role-group__count">' + members.length + ' 人</span>'
                        +  '</div>'
                        +  '<div class="role-group__body">';
                    if (members.length === 0) {
                        html += '<div class="role-group__empty">暂无' + m.name + '</div>';
                    } else {
                        html += '<div class="member-chips">' + members.map(function (u) {
                            return '<span class="member-chip" title="点击移除 ' + esc(u.name||u.userid) + ' 的' + m.name + '角色" onclick="removeRole(\'' + esc(u.userid) + '\',\'' + r + '\')">'
                                + '<span class="member-chip__name">' + esc(u.name || u.userid) + '</span>'
                                + '<span class="member-chip__x">✕</span>'
                                + '</span>';
                        }).join('') + '</div>';
                    }
                    html += '</div></div>';
                });
                container.innerHTML = html;
            } catch (e) {
                document.getElementById('roleList').innerHTML = '<div class="empty-tip">加载失败</div>';
            }
        }

        async function addRole() {
            const ids = document.getElementById('newUserid').value.split(/[,，\s]+/).filter(Boolean);
            if (ids.length === 0) {
                weui.topTips('请选择成员');
                return;
            }
            const roles = [];
            if (document.getElementById('roleAdmin').checked) roles.push('admin');
            if (document.getElementById('roleFinance').checked) roles.push('finance');
            if (document.getElementById('roleHr').checked) roles.push('hr');
            if (roles.length === 0) {
                weui.topTips('请至少勾选一个角色');
                return;
            }
            let ok = 0, fail = 0;
            for (const userid of ids) {
                for (const role of roles) {
                    try {
                        const resp = await fetch('/api/admin/roles/assign', {
                            method: 'POST',
                            headers: {'Content-Type': 'application/json'},
                            body: JSON.stringify({userid: userid, role_type: role})
                        });
                        const data = await resp.json();
                        if (data.success) ok++; else fail++;
                    } catch (e) { fail++; }
                }
            }
            if (ok > 0) {
                weui.toast('✅ 已添加 ' + ok + ' 项', 1200);
                pickedNameMap = {};
                document.getElementById('newUserid').value = '';
                document.getElementById('pickedMembers').innerHTML = '';
                document.getElementById('roleAdmin').checked = false;
                document.getElementById('roleFinance').checked = false;
                document.getElementById('roleHr').checked = false;
                HR_USERS = null; // 角色变更后清缓存，下次打开人事选择器会重新拉取
                loadRoles();
            }
            if (fail > 0) weui.topTips('有 ' + fail + ' 项添加失败');
        }

        async function removeRole(userid, role) {
            const m = ROLE_META[role] || { name: role };
            weui.confirm('确定移除 ' + esc(userid) + ' 的「' + m.name + '」角色吗？', async function () {
                try {
                    const resp = await fetch('/api/admin/roles/remove', {
                        method: 'POST',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({userid: userid, role_type: role})
                    });
                    const data = await resp.json();
                    if (data.success) {
                        weui.toast('✅ 已移除', 1000);
                        HR_USERS = null; // 角色变更后清缓存
                        loadRoles();
                    } else {
                        weui.topTips(data.error || '移除失败');
                    }
                } catch (e) {}
            });
        }

        // ===== 反馈负责人分配 =====
        async function loadAssignments() {
            try {
                const resp = await fetch('/api/admin/assignments/hr');
                const data = await resp.json();
                const container = document.getElementById('hrAssignmentList');
                container.innerHTML = '';

                if (data.length === 0) {
                    container.innerHTML = '<div class="empty-tip">暂未设置反馈负责人，员工反馈将通知所有人事</div>';
                    return;
                }

                // 按 assign_type + target_id 分组，同一目标的多位人事合并一行展示
                const groups = {};
                data.forEach(a => {
                    const key = a.assign_type + '||' + a.target_id;
                    if (!groups[key]) {
                        groups[key] = {
                            assign_type: a.assign_type,
                            target_id: a.target_id,
                            target_name: a.target_name,
                            hrs: [],        // [{id, userid, name}]
                        };
                    }
                    groups[key].hrs.push({id: a.id, userid: a.hr_userid, name: a.hr_name});
                });

                Object.values(groups).forEach(g => {
                    const hrsHtml = g.hrs.map(h =>
                        `<span class="badge badge-hr" onclick="delHrFromAssignment(${h.id},'${g.assign_type}','${esc(g.target_id)}')" title="点击移除该人事">👤 ${esc(h.name)} <span class="badge-x">✕</span></span>`
                    ).join('');
                    const allIds = g.hrs.map(h => h.id).join(',');
                    const div = document.createElement('div');
                    div.className = 'hr-assignment';
                    div.innerHTML = `
                        <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px;">
                            <span style="flex:1;min-width:0;line-height:1.6;">
                                <span style="font-size:13px;color:#999;">${g.assign_type === 'user' ? '👤 员工' : '🏢 部门'}</span>
                                <span style="font-size:14px;color:#1f2329;margin:0 4px;font-weight:600;">${esc(g.target_name)}</span>
                                <span style="color:#bbb;margin:0 4px;">→</span>
                                <span style="display:inline-flex;flex-wrap:wrap;gap:6px;vertical-align:middle;">${hrsHtml}</span>
                            </span>
                            <a href="javascript:delAssignmentGroup('${allIds}')" title="删除整组" style="flex:0 0 auto;color:#fa5151;font-size:16px;text-decoration:none;padding:4px 8px;border-radius:6px;background:#fdecec;">🗑</a>
                        </div>
                    `;
                    container.appendChild(div);
                });
            } catch (e) {}
        }

        // ===== 选择人事（可多选） =====
        var pickedHrMap = {};
        function setPickedHr(items) {
            items.forEach(function (i) { pickedHrMap[i.id] = i.name; });
            document.getElementById('hrUserid').value = Object.keys(pickedHrMap).join(',');
            renderPickedHr();
        }
        function removePickedHr(id) {
            delete pickedHrMap[id];
            document.getElementById('hrUserid').value = Object.keys(pickedHrMap).join(',');
            renderPickedHr();
        }
        function renderPickedHr() {
            const ids = Object.keys(pickedHrMap);
            document.getElementById('pickedHr').innerHTML = ids.length
                ? ids.map(function (id) {
                    return '<span class="chip">' + esc(pickedHrMap[id]) + ' <a href="javascript:removePickedHr(\'' + esc(id) + '\')" style="color:#3a7afe;text-decoration:none;font-weight:700;">✕</a></span>';
                }).join('')
                : '';
        }

        async function addAssignment() {
            const assignType = document.getElementById('assignType').value;
            const targetRaw = document.getElementById('assignTarget').value.trim();
            const hrRaw = document.getElementById('hrUserid').value.trim();

            if (!targetRaw || !hrRaw) {
                weui.topTips('请填写完整');
                return;
            }
            const targets = targetRaw.split(/[,，\s]+/).filter(Boolean);
            const hrs = hrRaw.split(/[,，\s]+/).filter(Boolean);
            if (hrs.length === 0) {
                weui.topTips('请选择至少一位人事');
                return;
            }
            let ok = 0, fail = 0;
            for (const targetId of targets) {
                try {
                    const resp = await fetch('/api/admin/assignments/hr', {
                        method: 'POST',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({
                            assign_type: assignType,
                            target_id: targetId,
                            hr_userids: hrs
                        })
                    });
                    const data = await resp.json();
                    if (data.success) ok += (data.count || hrs.length); else fail++;
                } catch (e) { fail++; }
            }
            if (ok > 0) {
                weui.toast('✅ 已添加 ' + ok + ' 条', 1200);
                document.getElementById('assignTarget').value = '';
                document.getElementById('assignTargetName').textContent = '';
                document.getElementById('hrUserid').value = '';
                pickedHrMap = {};
                renderPickedHr();
                loadAssignments();
            }
            if (fail > 0) weui.topTips('有 ' + fail + ' 条添加失败');
        }

        async function delAssignmentById(id, tipMsg) {
            try {
                const resp = await fetch('/api/admin/assignments/delete', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({id: id})
                });
                const data = await resp.json();
                if (!data.success) {
                    weui.topTips(data.error || '删除失败');
                    return false;
                }
                return true;
            } catch (e) {
                weui.topTips('删除失败');
                return false;
            }
        }

        async function delHrFromAssignment(id, assignType, targetId) {
            const name = assignType === 'user' ? '该员工' : '该部门';
            weui.confirm(`确定移除${name}分配中的该位人事吗？`, async function () {
                if (await delAssignmentById(id)) {
                    weui.toast('✅ 已移除', 1000);
                    loadAssignments();
                }
            });
        }

        async function delAssignmentGroup(allIds) {
            const ids = String(allIds).split(',').filter(Boolean);
            if (ids.length === 0) return;
            weui.confirm('确定删除该分配（包括其中所有人事）吗？', async function () {
                let ok = 0;
                for (const i of ids) {
                    if (await delAssignmentById(+i)) ok++;
                }
                if (ok > 0) {
                    weui.toast('✅ 已删除 ' + ok + ' 项', 1000);
                    loadAssignments();
                }
            });
        }
    </script>
</body>
</html>
