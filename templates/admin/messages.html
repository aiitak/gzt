<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=0">
<title>消息记录</title>
<link rel="stylesheet" href="/assets/weui.min.css?v=20260807a">
<link rel="stylesheet" href="/assets/admin.css?v=20260807a">
<script src="/assets/weui.min.js?v=20260807a"></script>
<script src="/assets/admin.js?v=20260807a"></script>
<style>
 body{background:#f5f5f5;font-family:-apple-system,"PingFang SC",sans-serif;margin:0;}
 .page{max-width:1000px;margin:0 auto;padding:15px;}
 .header{display:flex;justify-content:space-between;align-items:center;padding:10px 0;}
 .header h1{font-size:20px;margin:0;}
 .panel{background:#fff;border-radius:10px;padding:12px;margin-bottom:15px;box-shadow:0 1px 4px rgba(0,0,0,.06);}
 .panel h3{margin:4px 0 10px;font-size:15px;}
 .bar{display:flex;justify-content:space-between;align-items:center;}
 table{width:100%;border-collapse:collapse;font-size:13px;}
 th,td{border:1px solid #eee;padding:6px 8px;text-align:left;vertical-align:top;word-break:break-all;}
 th{background:#fafafa;color:#666;white-space:nowrap;}
</style>
</head>
<body>
<header class="ad-appbar">
  <a class="ad-appbar__back" href="/admin/dashboard" aria-label="返回">‹</a>
  <div class="ad-appbar__title"><span class="ic">📜</span><span>消息记录</span></div>
  <div class="ad-appbar__actions">
    <a class="ad-appbar__btn" href="javascript:doLogout()">退出</a>
  </div>
</header>
<div class="page">
  <div class="panel">
    <div class="bar">
      <h3>消息发送记录</h3>
    </div>
    <table>
      <thead><tr><th>时间</th><th>发送人</th><th>类型</th><th>接收人</th><th>标题</th><th>内容</th><th>状态</th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
    <div class="pager" id="messagePager"></div>
  </div>
</div>
<script>
var page=1;
var pageSize=parseInt(localStorage.getItem('message_pageSize') || '20', 10);
var totalPages=1;
function messageGoPage(p){ if (p < 1 || p > totalPages) return; page=p; load(); }
function messageChangePageSize(sz){
  pageSize = parseInt(sz, 10);
  localStorage.setItem('message_pageSize', sz);
  page = 1;
  load();
}
async function load(){
  try {
    var r=await fetch('/api/admin/message/log?page='+page+'&size='+pageSize); var d=await r.json();
    if(!d){ d = {}; }
    document.getElementById('rows').innerHTML = (d.list||[]).map(function(x){
      return '<tr><td>'+esc(x.created_at)+'</td><td>'+esc(x.sender)+'</td><td>'+esc(x.msgtype)
        +'</td><td>'+esc(x.recipients)+'</td><td>'+esc(x.title)+'</td><td>'+esc(x.content)
        +'</td><td>'+(x.status==1?'成功':'失败')+'</td></tr>';
    }).join('') || '<tr><td colspan="7">暂无记录</td></tr>';
    var total = d.total||0;
    totalPages = Math.max(1, Math.ceil(total/pageSize));
    renderPager('messagePager', page, totalPages, total, pageSize, 'messageGoPage', 'messageChangePageSize');
  } catch(e){
    document.getElementById('rows').innerHTML = '<tr><td colspan="7" style="color:#e64340;">加载失败：'+esc(e.message||e)+'</td></tr>';
  }
}
document.addEventListener('DOMContentLoaded', async function(){
  var me=await fetch('/api/auth/me');
  if(me.status===401){ location.href='/api/auth/login?redirect=/admin/messages'; return; }
  load();
});
</script>
</body>
</html>
