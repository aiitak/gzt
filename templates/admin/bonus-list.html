<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=0">
<title>奖金管理</title>
<link rel="stylesheet" href="/assets/weui.min.css?v=20260807a">
<link rel="stylesheet" href="/assets/admin.css?v=20260807a">
<script src="/assets/weui.min.js?v=20260807a"></script>
<script src="/assets/admin.js?v=20260807a"></script>
<style>
 body{background:#f5f5f5;font-family:-apple-system,"PingFang SC",sans-serif;margin:0;}
 .page{max-width:1100px;margin:0 auto;padding:15px;}
 .panel{background:#fff;border-radius:10px;padding:12px 14px;margin-bottom:14px;box-shadow:0 1px 4px rgba(0,0,0,.06);}
 .panel h3{margin:4px 0 10px;font-size:15px;}
 /* 筛选区：单行紧凑排列 */
 .filter-bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
 .filter-bar select{padding:7px 10px;border:1px solid #ddd;border-radius:6px;font-size:13px;background:#fff;min-width:130px;outline:none;}
 .btn{padding:7px 14px;border:none;border-radius:6px;font-size:13px;cursor:pointer;outline:none;}
 .btn-primary{background:#07c160;color:#fff;}
 .btn-primary:hover{background:#06ad56;}
 .btn-ghost{background:#fff;color:#333;border:1px solid #ddd;}
 .btn-ghost:hover{background:#f5f5f5;}
 .btn-warn{background:#fff;color:#e64340;border:1px solid #e64340;}
 .btn-warn:hover{background:#fef0f0;}
 .act-bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px;}
 /* 表格：竖直分割线 + 每5行循环颜色（白、浅粉、浅绿、浅米、浅蓝） */
 table{width:100%;border-collapse:collapse;font-size:13px;}
 table th,table td{padding:8px 10px;text-align:left;border-right:1px solid #eee;border-bottom:1px solid #eee;}
 table th:last-child,table td:last-child{border-right:none;}
 table th{background:#fafafa;color:#666;font-weight:600;position:sticky;top:0;}
 table tbody tr:nth-child(5n+1){background:#fff;}
 table tbody tr:nth-child(5n+2){background:#fff5f7;}
 table tbody tr:nth-child(5n+3){background:#f0f8f4;}
 table tbody tr:nth-child(5n+4){background:#fdf6e3;}
 table tbody tr:nth-child(5n+5){background:#eef3fc;}
 table tbody tr:hover{background:#f0f8ff;}
 .td-right{text-align:right;font-variant-numeric:tabular-nums;}
 .td-center{text-align:center;}
 .badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px;}
 .badge.draft{background:#f0f0f0;color:#999;}
 .badge.sent{background:#e8f0fe;color:#576b95;}
 .badge.confirmed{background:#e8f8e8;color:#07c160;}
 .badge.unconfirmed{background:#fff3e0;color:#ff9800;}
 .act-link{color:#576b95;cursor:pointer;text-decoration:none;margin-right:10px;}
 .act-link:hover{text-decoration:underline;}
 .act-link.danger{color:#e64340;}
 .loading{text-align:center;padding:30px;color:#999;font-size:13px;}
 .empty{text-align:center;color:#999;font-size:13px;padding:20px 0;}

 /* 详情弹窗 */
 .detail-mask{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:999;display:none;align-items:flex-start;justify-content:center;padding:20px 10px;overflow:auto;}
 .detail-mask.show{display:flex;}
 .detail-box{background:#fff;border-radius:10px;width:100%;max-width:600px;padding:18px 20px;margin-bottom:20px;}
 .detail-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:12px;padding-bottom:10px;border-bottom:1px solid #eee;}
 .detail-head h3{margin:0;font-size:17px;}
 .detail-head .close{font-size:22px;color:#999;cursor:pointer;text-decoration:none;line-height:1;}
 .detail-info{display:flex;flex-wrap:wrap;gap:12px;font-size:13px;color:#666;margin-bottom:14px;}
 .detail-info span{background:#f6f8fa;padding:3px 8px;border-radius:4px;}
 .detail-total{background:linear-gradient(135deg,#07c160,#1aa86a);color:#fff;border-radius:10px;padding:14px;text-align:center;margin-bottom:14px;}
 .detail-total .lbl{font-size:12px;opacity:.9;}
 .detail-total .val{font-size:28px;font-weight:700;margin-top:4px;}
 .detail-group{margin-bottom:10px;border:1px solid #eee;border-radius:8px;overflow:hidden;}
 .detail-group__head{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;font-size:13px;font-weight:600;}
 .detail-group__head.income{background:#f0f8f4;color:#07c160;border-left:3px solid #07c160;}
 .detail-group__head.deduction{background:#fef0f0;color:#e64340;border-left:3px solid #e64340;}
 .detail-group__head.other{background:#f6f8fa;color:#666;border-left:3px solid #999;}
 .detail-group__sum{font-weight:700;}
 .detail-group__items{padding:4px 0;}
 .detail-item{display:flex;justify-content:space-between;padding:7px 12px;font-size:13px;border-bottom:1px solid #f8f8f8;}
 .detail-item:last-child{border-bottom:none;}
 .detail-item .lbl{color:#666;}
 .detail-item .val{font-weight:500;font-variant-numeric:tabular-nums;}
 .detail-item .val.negative{color:#e64340;}

 /* 确认弹窗 */
 .cm-mask{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:1000;display:none;align-items:center;justify-content:center;}
 .cm-mask.show{display:flex;}
 .cm-box{background:#fff;border-radius:12px;width:90%;max-width:360px;overflow:hidden;box-shadow:0 8px 30px rgba(0,0,0,.18);animation:cmPop .18s ease-out;}
 @keyframes cmPop{from{transform:scale(.92);opacity:0;}to{transform:scale(1);opacity:1;}}
 .cm-head{padding:18px 20px 8px;text-align:center;}
 .cm-icon{width:52px;height:52px;border-radius:50%;background:#fef0f0;display:flex;align-items:center;justify-content:center;margin:0 auto 10px;font-size:26px;}
 .cm-icon.warn{background:#fef0f0;color:#e64340;}
 .cm-title{font-size:16px;font-weight:600;color:#333;}
 .cm-body{padding:4px 20px 16px;text-align:center;font-size:13px;color:#888;line-height:1.6;}
 .cm-body b{color:#333;font-weight:600;}
 .cm-actions{display:flex;border-top:1px solid #f0f0f0;}
 .cm-btn{flex:1;padding:13px 0;text-align:center;font-size:15px;cursor:pointer;border:none;background:transparent;}
 .cm-btn.cancel{color:#999;border-right:1px solid #f0f0f0;}
 .cm-btn.cancel:hover{background:#fafafa;}
 .cm-btn.ok{color:#e64340;font-weight:600;}
 .cm-btn.ok:hover{background:#fef0f0;}

 /* Toast 浮动消息 */
 .toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.82);color:#fff;padding:8px 16px;border-radius:8px;font-size:13px;z-index:2000;opacity:0;transition:opacity .25s,top .25s;pointer-events:none;box-shadow:0 4px 14px rgba(0,0,0,.2);}
 .toast.show{opacity:1;top:30px;}
 .toast.success{background:rgba(7,193,96,.92);}
 .toast.error{background:rgba(230,67,64,.92);}
</style>
</head>
<body>
<header class="ad-appbar">
  <a class="ad-appbar__back" href="/admin/dashboard" aria-label="返回首页">‹</a>
  <div class="ad-appbar__title"><span class="ic">🎁</span><span>奖金管理</span></div>
  <div class="ad-appbar__actions">
    <span id="userInfo" class="ad-appbar__btn" style="cursor:default;background:rgba(255,255,255,.12);"></span>
    <a class="ad-appbar__btn" href="/admin/dashboard">首页</a>
    <a class="ad-appbar__btn" href="javascript:doLogout()">退出</a>
  </div>
</header>
<div class="page">

  <!-- 筛选区 -->
  <div class="panel">
    <div class="filter-bar">
      <select id="yearSel"><option value="">全部年份</option></select>
      <select id="typeSel"><option value="">全部类型</option></select>
      <button class="btn btn-primary" onclick="loadList()">查询</button>
      <button class="btn btn-ghost" onclick="resetFilter()">重置</button>
      <a href="/admin/bonus_trash" class="btn btn-ghost" style="margin-left:auto;text-decoration:none;display:inline-flex;align-items:center;gap:4px;">🗑️ 回收站</a>
    </div>
  </div>

  <!-- 操作 + 列表 -->
  <div class="panel">
    <div class="act-bar">
      <button class="btn btn-warn" onclick="batchDelete()">🗑 批量删除</button>
      <span style="margin-left:auto;color:#999;font-size:12px;" id="listCount"></span>
    </div>
    <div style="overflow-x:auto;">
      <table id="bonusTable">
        <thead>
          <tr>
            <th>姓名</th>
            <th>部门</th>
            <th>年份</th>
            <th>奖金类型</th>
            <th class="td-right">金额</th>
            <th class="td-center">状态</th>
            <th class="td-center">确认</th>
            <th class="td-center">备注</th>
            <th>操作</th>
          </tr>
        </thead>
        <tbody id="bonusTbody"></tbody>
      </table>
    </div>
    <div class="pager" id="bonusPager"></div>
  </div>

</div>

<!-- 详情弹窗 -->
<div class="detail-mask" id="detailMask">
  <div class="detail-box" id="detailBox"></div>
</div>

<!-- 备注详情弹窗 -->
<div class="cm-mask" id="remarkMask">
  <div class="cm-box" style="max-width:460px;">
    <div class="cm-head">
      <div class="cm-icon" style="background:#fff8e1;color:#ffa726;">📝</div>
      <div class="cm-title">备注详情</div>
    </div>
    <div class="cm-body" id="remarkBody" style="text-align:left;white-space:pre-wrap;word-break:break-all;max-height:50vh;overflow-y:auto;"></div>
    <div class="cm-actions">
      <button class="cm-btn ok" style="color:#07c160;" onclick="closeRemark()">关闭</button>
    </div>
  </div>
</div>

<!-- 确认弹窗 -->
<div class="cm-mask" id="cmMask">
  <div class="cm-box">
    <div class="cm-head">
      <div class="cm-icon warn">⚠️</div>
      <div class="cm-title" id="cmTitle">确认操作</div>
    </div>
    <div class="cm-body" id="cmBody"></div>
    <div class="cm-actions">
      <button class="cm-btn cancel" onclick="cmClose()">取消</button>
      <button class="cm-btn ok" id="cmOkBtn">确认</button>
    </div>
  </div>
</div>

<!-- Toast 浮动消息 -->
<div class="toast" id="toast"></div>

<script>
/**
 * 明细项金额格式化（与全局 window.fmtMoney 功能不同，保留本处定义）：
 *   - 全局 fmtMoney 返回 HTML（amt-toggle 包裹，支持点击隐藏/显示金额），toFixed(2) 无千分位
 *   - 本 itemMoney 返回纯文本，带 zh-CN 千分位，并根据 isDeduction 在扣除项前加负号
 *   - 用于详情弹窗 renderDetail 中的明细项（391 行）
 */
function itemMoney(v, isDeduction){
  var n = Math.abs(parseFloat(v||0));
  var s = '¥' + n.toLocaleString('zh-CN',{minimumFractionDigits:2,maximumFractionDigits:2});
  return isDeduction ? '-'+s : s;
}

// ===== Toast =====
var TOAST_TIMER = null;
function toast(msg, type){
  var el = document.getElementById('toast');
  el.className = 'toast' + (type ? ' ' + type : '');
  el.textContent = msg;
  el.classList.add('show');
  if(TOAST_TIMER) clearTimeout(TOAST_TIMER);
  TOAST_TIMER = setTimeout(function(){ el.classList.remove('show'); }, type === 'error' ? 3000 : 2000);
}

// ===== 确认弹窗 =====
var CM_CALLBACK = null;
function cmOpen(opts){
  document.getElementById('cmTitle').textContent = opts.title || '确认操作';
  document.getElementById('cmBody').innerHTML = opts.body || '';
  document.getElementById('cmOkBtn').textContent = opts.okText || '确认';
  document.getElementById('cmOkBtn').style.color = (opts.okColor || '#e64340');
  CM_CALLBACK = opts.onOk || null;
  document.getElementById('cmMask').classList.add('show');
}
function cmClose(){
  document.getElementById('cmMask').classList.remove('show');
  CM_CALLBACK = null;
}
document.getElementById('cmOkBtn').addEventListener('click', function(){
  var cb = CM_CALLBACK;
  cmClose();
  if(cb) cb();
});
document.getElementById('cmMask').addEventListener('click', function(e){
  if(e.target === this) cmClose();
});

var ALL_YEARS = [];
var ALL_TYPES = [];
var CURRENT_LIST = [];
var BONUS_PAGE = 1;
var BONUS_PAGE_SIZE = parseInt(localStorage.getItem('bonus_pageSize') || '20', 10);
var totalPages = 1;

/** 拉取列表与筛选选项；不带参数时返回全部并刷新年份/类型下拉 */
async function initFilter(){
  try {
    var r = await fetch('/api/bonus/list');
    if(r.status === 401){ location.href = '/api/auth/login?redirect=/admin/bonus_list'; return; }
    var d = await r.json();
    if(!d.success){ toast('加载失败', 'error'); return; }
    ALL_YEARS = d.years || [];
    ALL_TYPES = d.types || [];
    fillFilters();
    CURRENT_LIST = d.list || [];
    BONUS_PAGE = 1;
    renderList();
  } catch(e){
    toast('加载失败：'+(e.message||e), 'error');
  }
}

function fillFilters(){
  var ys = document.getElementById('yearSel');
  var ts = document.getElementById('typeSel');
  ys.innerHTML = '<option value="">全部年份</option>';
  ALL_YEARS.forEach(function(y){ ys.innerHTML += '<option value="'+esc(y)+'">'+esc(y)+'年</option>'; });
  ts.innerHTML = '<option value="">全部类型</option>';
  ALL_TYPES.forEach(function(t){ ts.innerHTML += '<option value="'+esc(t)+'">'+esc(t)+'</option>'; });
}

async function loadList(){
  var year = document.getElementById('yearSel').value;
  var type = document.getElementById('typeSel').value;
  var qs = [];
  if(year) qs.push('year='+encodeURIComponent(year));
  if(type) qs.push('type='+encodeURIComponent(type));
  var url = '/api/bonus/list' + (qs.length ? '?'+qs.join('&') : '');
  document.getElementById('bonusTbody').innerHTML = '<tr><td colspan="9" class="loading">加载中...</td></tr>';
  try {
    var r = await fetch(url);
    var d = await r.json();
    if(!d.success){
      document.getElementById('bonusTbody').innerHTML = '<tr><td colspan="9" class="empty">加载失败</td></tr>';
      return;
    }
    CURRENT_LIST = d.list || [];
    BONUS_PAGE = 1;
    renderList();
  } catch(e){
    document.getElementById('bonusTbody').innerHTML = '<tr><td colspan="9" class="empty">加载失败：'+esc(e.message||e)+'</td></tr>';
  }
}

function resetFilter(){
  document.getElementById('yearSel').value = '';
  document.getElementById('typeSel').value = '';
  loadList();
}

function renderList(){
  var list = CURRENT_LIST;
  document.getElementById('listCount').textContent = list.length ? ('共 '+list.length+' 条') : '';
  if(list.length === 0){
    document.getElementById('bonusTbody').innerHTML = '<tr><td colspan="9" class="empty">暂无奖金数据</td></tr>';
    document.getElementById('bonusPager').innerHTML = '';
    return;
  }
  var total = list.length;
  var pageSize = BONUS_PAGE_SIZE;
  var totalPages = Math.ceil(total / pageSize);
  if(BONUS_PAGE > totalPages) BONUS_PAGE = totalPages;
  if(BONUS_PAGE < 1) BONUS_PAGE = 1;
  var start = (BONUS_PAGE - 1) * pageSize;
  var pageList = list.slice(start, start + pageSize);
  document.getElementById('bonusTbody').innerHTML = pageList.map(function(b){
    var statusBadge = b.status === 'sent' ? '<span class="badge sent">已下发</span>' : '<span class="badge draft">草稿</span>';
    var confirmBadge = b.confirmed ? '<span class="badge confirmed">✓ 已确认</span>' : '<span class="badge unconfirmed">待确认</span>';
    var remarkHtml = (b.remark && b.remark.trim()) ? '<a class="act-link" onclick="showRemark('+b.id+')">详情</a>' : '';
    return '<tr>'
      + '<td>'+esc(b.name||b.userid)+'</td>'
      + '<td>'+esc(b.dept_name||'未分配')+'</td>'
      + '<td>'+esc(b.year)+'</td>'
      + '<td>'+esc(b.bonus_type)+'</td>'
      + '<td class="td-right">'+fmtMoney(b.amount)+'</td>'
      + '<td class="td-center">'+statusBadge+'</td>'
      + '<td class="td-center">'+confirmBadge+'</td>'
      + '<td class="td-center">'+remarkHtml+'</td>'
      + '<td><a class="act-link" onclick="showDetail('+b.id+')">查看详情</a><a class="act-link danger" onclick="deleteOne('+b.id+')">删除</a></td>'
      + '</tr>';
  }).join('');
  renderPager('bonusPager', BONUS_PAGE, totalPages, total, pageSize, 'bonusGoPage', 'bonusChangePageSize');
}

function bonusGoPage(p){ if (p < 1 || p > totalPages) return; BONUS_PAGE = p; renderList(); }
function bonusChangePageSize(sz){
  BONUS_PAGE_SIZE = parseInt(sz, 10);
  localStorage.setItem('bonus_pageSize', sz);
  BONUS_PAGE = 1;
  renderList();
}

async function showDetail(id){
  document.getElementById('detailMask').classList.add('show');
  document.getElementById('detailBox').innerHTML = '<div class="loading">加载中...</div>';
  try {
    var r = await fetch('/api/bonus/detail/'+id);
    var d = await r.json();
    if(!d.success){
      document.getElementById('detailBox').innerHTML = '<div style="color:#e64340;padding:20px;">'+esc(d.error||'加载失败')+'</div>';
      return;
    }
    var b = d.bonus;
    var items = d.items || [];
    // 过滤掉「实发奖金」项：已作为顶部总额展示，明细中不再重复
    items = items.filter(function(it){ return (it.item_name||'').indexOf('实发奖金') === -1; });
    renderDetail(b, items);
  } catch(e){
    document.getElementById('detailBox').innerHTML = '<div style="color:#e64340;padding:20px;">加载失败：'+esc(e.message||e)+'</div>';
  }
}

function renderDetail(b, items){
  var amount = parseFloat(b.amount||0).toFixed(2);
  // 按 category 分组（保持出现顺序）
  var groupMap = {};
  var order = [];
  items.forEach(function(it){
    var cat = it.category || '';
    if(!groupMap[cat]){ groupMap[cat] = []; order.push(cat); }
    groupMap[cat].push(it);
  });

  var groupsHtml = '';
  if(items.length === 0){
    groupsHtml = '<div class="empty">暂无明细项</div>';
  } else {
    groupsHtml = order.map(function(cat){
      var its = groupMap[cat];
      var allDeduction = its.every(function(x){ return x.is_deduction == 1; });
      var anyDeduction = its.some(function(x){ return x.is_deduction == 1; });
      // 全部扣除 → 红色；全部收入 → 绿色；混合 → 灰色
      var cls = allDeduction ? 'deduction' : (anyDeduction ? 'other' : 'income');
      var sum = its.reduce(function(s,x){ return s + (x.is_deduction==1 ? -1 : 1) * Math.abs(parseFloat(x.item_value)||0); }, 0);
      var sumStr = (sum < 0 ? '-' : '') + '¥' + Math.abs(sum).toLocaleString('zh-CN',{minimumFractionDigits:2,maximumFractionDigits:2});
      // 空 category 不显示分组标题，直接平铺项目
      var headHtml = cat === '' ? ''
        : '<div class="detail-group__head '+cls+'"><span>'+esc(cat)+'</span><span class="detail-group__sum">'+sumStr+'</span></div>';
      var itemsHtml = its.map(function(it){
        var isD = it.is_deduction == 1;
        var valCls = isD ? 'negative' : '';
        return '<div class="detail-item"><span class="lbl">'+esc(it.item_name)+'</span><span class="val '+valCls+'">'+itemMoney(it.item_value, isD)+'</span></div>';
      }).join('');
      return '<div class="detail-group">'+headHtml+'<div class="detail-group__items">'+itemsHtml+'</div></div>';
    }).join('');
  }

  document.getElementById('detailBox').innerHTML =
    '<div class="detail-head"><h3>🎁 '+esc(b.name||b.userid)+' 的奖金</h3><a class="close" href="javascript:closeDetail()">×</a></div>'
    + '<div class="detail-info">'
    + '<span>📅 '+esc(b.year)+'年</span>'
    + '<span>🏷 '+esc(b.bonus_type)+'</span>'
    + '<span>🏢 '+esc(b.dept_name||'未分配')+'</span>'
    + '<span>👤 '+esc(b.userid)+'</span>'
    + (b.pushed_at ? '<span>📨 下发:'+esc(b.pushed_at)+'</span>' : '')
    + (b.confirmed_at ? '<span>✅ 确认:'+esc(b.confirmed_at)+'</span>' : '')
    + '</div>'
    + '<div class="detail-total"><div class="lbl">实发奖金</div><div class="val">¥'+esc(amount)+'</div></div>'
    + groupsHtml;
}

function closeDetail(){
  document.getElementById('detailMask').classList.remove('show');
}

// 批量删除（按年份+类型）
function batchDelete(){
  var year = document.getElementById('yearSel').value;
  var type = document.getElementById('typeSel').value;
  if(!year || !type){ toast('请先选择年份和奖金类型', 'error'); return; }
  cmOpen({
    title: '批量删除奖金',
    body: '确认删除 <b>'+esc(year)+'年 '+esc(type)+'</b> 的全部奖金记录？<br>该操作不可恢复，将同时删除所有明细。',
    okText: '确认删除',
    onOk: doBatchDelete
  });
}

async function doBatchDelete(){
  var year = document.getElementById('yearSel').value;
  var type = document.getElementById('typeSel').value;
  try {
    var r = await fetch('/api/bonus/delete', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ year: parseInt(year,10), bonus_type: type, scope:'all' })
    });
    var d = await r.json();
    if(d.success){
      toast('已删除 '+d.deleted+' 条', 'success');
      // 类型/年份可能减少，重新加载筛选与列表
      initFilter();
    } else {
      toast('删除失败：'+(d.error||'未知错误'), 'error');
    }
  } catch(e){
    toast('删除请求失败：'+(e.message||e), 'error');
  }
}

// 单条删除（二次确认）
function deleteOne(id){
  var b = CURRENT_LIST.find(function(x){ return x.id == id; });
  var name = b ? (b.name||b.userid) : ('#'+id);
  cmOpen({
    title: '删除奖金记录',
    body: '确认删除「<b>'+esc(name)+'</b>」的奖金记录？<br>该操作不可恢复。',
    okText: '确认删除',
    onOk: function(){ doDeleteOne(id); }
  });
}

async function doDeleteOne(id){
  try {
    var r = await fetch('/api/bonus/delete', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ id: id })
    });
    var d = await r.json();
    if(d.success){
      toast('已删除', 'success');
      loadList();
    } else {
      toast('删除失败：'+(d.error||'未知错误'), 'error');
    }
  } catch(e){
    toast('删除请求失败：'+(e.message||e), 'error');
  }
}

// 点击遮罩关闭详情
document.getElementById('detailMask').addEventListener('click', function(e){
  if(e.target === this) closeDetail();
});

// 备注弹窗
function showRemark(id){
  var b = CURRENT_LIST.find(function(x){ return x.id == id; });
  if(!b || !b.remark) return;
  document.getElementById('remarkBody').textContent = b.remark;
  document.getElementById('remarkMask').classList.add('show');
}
function closeRemark(){
  document.getElementById('remarkMask').classList.remove('show');
}
document.getElementById('remarkMask').addEventListener('click', function(e){
  if(e.target === this) closeRemark();
});

document.addEventListener('DOMContentLoaded', async function(){
  var me = await fetch('/api/auth/me');
  if(me.status === 401){ location.href = '/api/auth/login?redirect=/admin/bonus_list'; return; }
  var ud = await me.json();
  if(!ud.logged_in){ location.href = '/api/auth/login?redirect=/admin/bonus_list'; return; }
  var infoEl = document.getElementById('userInfo');
  infoEl.textContent = '👤 ' + (ud.name || ud.userid || '');
  initFilter();
});
</script>
